<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestrator Dashboard - BeakBroodNest</title>
    <link rel="icon" href="/beakbroodnest/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/beakbroodnest/static/vendor/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/beakbroodnest/static/css/dashboard.css?v={{ cache_ver }}">
    <script defer src="/beakbroodnest/static/vendor/alpine.min.js"></script>
</head>
<body>

<div x-data="dashboard()" x-init="init()">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand mb-0" href="/beakbroodnest/"
                   style="font-weight:700;font-size:15px;color:#3b82f6;letter-spacing:-0.3px;">BeakBroodNest</a>
                {% include 'partials/nav_menu.html' %}
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="badge" :class="polling ? 'bg-success' : 'bg-secondary'"
                      @click="togglePolling()" role="button"
                      x-text="polling ? 'LIVE ' + pollInterval + 's' : 'PAUSED'"></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-3">

        <!-- Stats Bar (扁平單列) -->
        <div class="d-flex flex-wrap align-items-center gap-3 mb-2 px-3 py-1 bg-white border rounded small">
            <span class="text-secondary">全部 <strong x-text="stats.total || 0"></strong></span>
            <template x-for="s in statusDefs" :key="'sb-' + s.key">
                <span>
                    <span class="text-secondary">|</span>
                    <span class="ms-2" :style="'color:' + s.color"
                          x-text="s.label"></span>
                    <strong class="ms-1"
                            x-text="(stats.by_status && stats.by_status[s.key]) || 0"></strong>
                </span>
            </template>
            <span class="text-secondary">|</span>
            <span class="text-secondary">活躍 Session <strong x-text="stats.active_session_count || 0"></strong></span>
        </div>

        <!-- Filter bar -->
        <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
            <span class="text-secondary small">篩選:</span>
            <button class="btn btn-sm" :class="filterStatus ? 'btn-outline-primary' : 'btn-primary'"
                    @click="setFilter('')">
                全部 (<span x-text="stats.total || 0"></span>)
            </button>
            <template x-for="s in statusDefs" :key="'f-' + s.key">
                <button class="btn btn-sm"
                        :class="filterStatus === s.key ? 'btn-primary' : 'btn-outline-secondary'"
                        :disabled="((stats.by_status && stats.by_status[s.key]) || 0) === 0"
                        @click="setFilter(s.key)">
                    <span x-text="s.label"></span>
                    (<span x-text="(stats.by_status && stats.by_status[s.key]) || 0"></span>)
                </button>
            </template>
            <div class="ms-auto text-secondary small">
                <span x-text="'共 ' + taskTotal + ' 筆'"></span>
                <span class="ms-2" x-text="lastUpdated"></span>
            </div>
        </div>

        <!-- 左右 Layout: 左清單 / 右詳情 -->
        <div class="row g-3 flex-md-nowrap">

            <!-- 左：Tasks Table -->
            <div class="col-md-5">
                <div class="card" style="height:calc(100vh - 170px); overflow-y:auto;">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th style="width:50px">#</th>
                                    <th style="width:90px" role="button" @click="sortBy('status')">
                                        狀態 <span x-text="sortIcon('status')"></span>
                                    </th>
                                    <th>標題</th>
                                    <th style="width:90px" role="button" @click="sortBy('created_at')">
                                        建立 <span x-text="sortIcon('created_at')"></span>
                                    </th>
                                    <th style="width:50px" class="text-center">R</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-if="tasks.length === 0">
                                    <tr><td colspan="5" class="text-center text-secondary py-4">無任務資料</td></tr>
                                </template>
                                <template x-for="t in sortedTasks" :key="t.id">
                                    <tr :class="{'table-active': expandedId === t.id}" @click="toggleExpand(t.id)" role="button">
                                        <td x-text="t.id"></td>
                                        <td>
                                            <span class="badge" :class="statusClass(t.status)" x-text="t.status"></span>
                                        </td>
                                        <td class="text-truncate" style="max-width:0;" :title="t.title">
                                            <span x-text="t.title"></span>
                                        </td>
                                        <td class="small text-secondary" x-text="fmtTime(t.created_at)"></td>
                                        <td class="text-center">
                                            <span class="badge bg-secondary" x-text="t._report_count ?? '?'"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 右：Detail -->
            <div class="col-md-7">
                <template x-if="!expandedId">
                    <div class="card" style="height:calc(100vh - 170px);">
                        <div class="card-body d-flex align-items-center justify-content-center text-secondary">
                            點選左側任務查看詳情
                        </div>
                    </div>
                </template>
                <template x-if="expandedId && detail">
                    <div class="card border-primary" style="height:calc(100vh - 170px); overflow-y:auto;">
                        <div class="card-header bg-light sticky-top d-flex justify-content-between align-items-center">
                            <span>
                                任務 #<span x-text="detail.id"></span>
                                <span class="badge ms-2" :class="statusClass(detail.status)" x-text="detail.status"></span>
                                <code class="small ms-2" x-text="detail.model"></code>
                                <span class="small text-secondary ms-2" x-text="elapsed(detail)"></span>
                            </span>
                            <button class="btn btn-sm btn-outline-secondary" @click="closeDetail()">關閉</button>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm table-borderless mb-2 small">
                                <tr><th class="text-secondary" style="width:100px">Worker ID</th><td><code x-text="detail.worker_id"></code></td></tr>
                                <tr><th class="text-secondary">Working Dir</th><td><code x-text="detail.working_dir"></code></td></tr>
                                <tr><th class="text-secondary">Session ID</th><td class="text-break"><code x-text="detail.session_id || '-'"></code></td></tr>
                                <tr><th class="text-secondary">tmux</th><td><code x-text="(detail.tmux_session || '-') + ' / ' + (detail.tmux_pane || '-')"></code></td></tr>
                                <tr><th class="text-secondary">Timeout</th><td x-text="detail.timeout_seconds + 's'"></td></tr>
                            </table>

                            <div class="mb-3">
                                <h6 class="text-secondary small">指令</h6>
                                <pre class="bg-light p-2 rounded small" style="white-space:pre-wrap; word-break:break-word;"
                                     x-text="detail.instruction"></pre>
                            </div>

                            <template x-if="detail.reports && detail.reports.length > 0">
                                <div>
                                    <h6 class="text-secondary small">Reports (<span x-text="detail.reports.length"></span>)</h6>
                                    <template x-for="r in detail.reports" :key="r.id">
                                        <div class="card mb-2">
                                            <div class="card-header py-1 px-2 small d-flex justify-content-between">
                                                <span>
                                                    Report #<span x-text="r.id"></span>
                                                    <span class="badge"
                                                          :class="{'bg-warning text-dark': r.review_status === 'pending',
                                                                   'bg-success': r.review_status === 'approved',
                                                                   'bg-danger': r.review_status === 'rejected',
                                                                   'bg-info': r.review_status === 'promoted'}"
                                                          x-text="r.review_status"></span>
                                                    <span class="text-secondary ms-1" x-text="'exit=' + (r.exit_code ?? '?')"></span>
                                                </span>
                                                <span class="text-secondary" x-text="fmtTime(r.created_at)"></span>
                                            </div>
                                            <div class="card-body py-2 px-2">
                                                <pre class="mb-0 small" style="max-height:300px; overflow-y:auto; white-space:pre-wrap;"
                                                     x-text="r.content || '(empty)'"></pre>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template x-if="!detail.reports || detail.reports.length === 0">
                                <p class="text-secondary small">無 Report 資料</p>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

        </div>

    </div>
</div>

<script src="/beakbroodnest/static/vendor/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
<script src="/beakbroodnest/static/js/dashboard.js?v={{ cache_ver }}"></script>
</body>
</html>
