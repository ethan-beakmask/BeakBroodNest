    <!-- ============================================ -->
    <!-- Modals -->
    <!-- ============================================ -->

    <!-- 卡片資訊對話框（雙擊卡片觸發） -->
    <template x-if="showAtomInfoModal && selectedAtomDetails">
        <div class="modal-overlay">
            <div class="modal atom-info-modal">
                <div class="modal-header">
                    <h3 x-text="selectedAtomDetails.title || '(無標題)'"></h3>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <button class="btn btn-sm btn-primary" style="font-size:11px;padding:2px 10px;"
                                @click="showAtomInfoModal=false; openCardEditor(selectedAtomDetails.id)">開啟編輯器</button>
                        <button class="modal-close" @click="showAtomInfoModal=false">x</button>
                    </div>
                </div>
                <div class="modal-body" style="padding:0;">
                    <div class="atom-info-layout">
                        <!-- 左欄：基本資訊 -->
                        <div class="atom-info-left">
                            <!-- Owner 唯讀警告 -->
                            <div class="wb-panel-readonly-notice"
                                 x-show="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'">
                                <span>唯讀</span> -- 屬於 <strong x-text="ownerDisplayName(selectedAtomDetails.owner)"></strong>
                            </div>

                            <div class="form-group">
                                <label>標題</label>
                                <input class="form-control"
                                       :value="selectedAtomDetails.title || ''"
                                       :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                       @change="updateAtomFieldById(selectedAtomDetails.id, 'title', $event.target.value)">
                            </div>
                            <div class="form-group">
                                <label>內容</label>
                                <textarea class="form-control" rows="6"
                                          :value="selectedAtomDetails.content || ''"
                                          :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                          @change="updateAtomFieldById(selectedAtomDetails.id, 'content', $event.target.value)"></textarea>
                            </div>
                            <div style="display:flex;gap:8px;">
                                <div class="form-group" style="flex:1;">
                                    <label>類型</label>
                                    <select class="form-control"
                                            :value="selectedAtomDetails.atom_type || 'F'"
                                            :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                            @change="updateAtomFieldById(selectedAtomDetails.id, 'atom_type', $event.target.value)">
                                        <option value="A">A - 萬用</option>
                                        <option value="B">B - 發散</option>
                                        <option value="C">C - 流程</option>
                                        <option value="D">D - 歸納</option>
                                        <option value="E">E - 套表</option>
                                        <option value="F">F - 碎片</option>
                                    </select>
                                </div>
                                <div class="form-group" style="flex:1;">
                                    <label>生命週期</label>
                                    <select class="form-control"
                                            :value="selectedAtomDetails.lifecycle || 'active'"
                                            :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                            @change="updateAtomFieldById(selectedAtomDetails.id, 'lifecycle', $event.target.value)">
                                        <option value="active">active</option>
                                        <option value="aging">aging</option>
                                        <option value="archived">archived</option>
                                        <option value="terminal">terminal</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 標籤 -->
                            <div class="form-group">
                                <label>標籤</label>
                                <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                    <template x-for="t in tags" :key="'ai-t-'+t.id">
                                        <span class="tag-badge"
                                              :style="getTagStyle(t.color) + 'cursor:pointer;'"
                                              :class="{ selected: selectedAtomDetails.tags && selectedAtomDetails.tags.some(at => at.id === t.id) }"
                                              @click="toggleAtomTagById(selectedAtomDetails.id, t.id)"
                                              x-show="selectedAtomDetails.owner === 'ethan' || (selectedAtomDetails.tags && selectedAtomDetails.tags.some(at => at.id === t.id))">
                                            <span x-show="selectedAtomDetails.tags && selectedAtomDetails.tags.some(at => at.id === t.id)">v </span>
                                            <span x-text="t.name"></span>
                                        </span>
                                    </template>
                                </div>
                            </div>

                            <!-- 資訊 -->
                            <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light);">
                                <div class="text-sm text-muted">
                                    <span>Vitality: <strong x-text="selectedAtomDetails.vitality_score != null ? selectedAtomDetails.vitality_score.toFixed(2) : '-'"></strong></span>
                                    <span style="margin-left:12px;">擁有者: <span x-text="ownerDisplayName(selectedAtomDetails.owner)"></span></span>
                                    <span style="margin-left:12px;">來源: <span x-text="selectedAtomDetails.source || ''"></span></span>
                                </div>
                                <div class="text-sm text-muted" style="margin-top:2px;">
                                    <span>建立: <span x-text="formatDate(selectedAtomDetails.created_at)"></span></span>
                                    <span style="margin-left:12px;">更新: <span x-text="formatDate(selectedAtomDetails.updated_at)"></span></span>
                                </div>
                            </div>
                        </div>

                        <!-- 右欄：關係 + 阻塞 -->
                        <div class="atom-info-right">
                            <!-- 因果關係 -->
                            <div style="margin-bottom:12px;">
                                <div class="wb-panel-section-title">因果關係</div>

                                <template x-if="selectedAtomDetails.relations_from && selectedAtomDetails.relations_from.length > 0">
                                    <div class="relation-list">
                                        <div class="relation-list-title">出 --></div>
                                        <template x-for="r in selectedAtomDetails.relations_from" :key="'ai-rf-'+r.id">
                                            <div class="relation-item"
                                                 :class="{ 'off-canvas': !isAtomOnCanvas(r.to_atom_id) }"
                                                 @click="if(isAtomOnCanvas(r.to_atom_id)){ showAtomInfoModal=false; navigateToAtom(r.to_atom_id); }">
                                                <span class="relation-type-badge" x-text="relationLabelMap[r.relation_type] || r.relation_type"></span>
                                                <span class="relation-target" x-text="r.to_atom ? r.to_atom.title : '#' + r.to_atom_id"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template x-if="selectedAtomDetails.relations_to && selectedAtomDetails.relations_to.length > 0">
                                    <div class="relation-list mt-2">
                                        <div class="relation-list-title">入 <--</div>
                                        <template x-for="r in selectedAtomDetails.relations_to" :key="'ai-rt-'+r.id">
                                            <div class="relation-item"
                                                 :class="{ 'off-canvas': !isAtomOnCanvas(r.from_atom_id) }"
                                                 @click="if(isAtomOnCanvas(r.from_atom_id)){ showAtomInfoModal=false; navigateToAtom(r.from_atom_id); }">
                                                <span class="relation-type-badge" x-text="relationLabelMap[r.relation_type] || r.relation_type"></span>
                                                <span class="relation-target" x-text="r.from_atom ? r.from_atom.title : '#' + r.from_atom_id"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <div x-show="(!selectedAtomDetails.relations_from || selectedAtomDetails.relations_from.length === 0) && (!selectedAtomDetails.relations_to || selectedAtomDetails.relations_to.length === 0)"
                                     class="text-sm text-muted mt-2">尚無關係</div>
                            </div>

                            <!-- 阻塞狀態 -->
                            <template x-if="selectedAtomDetails.is_blocked">
                                <div>
                                    <div class="wb-panel-section-title">阻塞狀態</div>
                                    <div class="block-status-badge">已阻塞</div>
                                    <div class="mt-2">
                                        <template x-for="b in (selectedAtomDetails.blockers || [])" :key="'ai-bl-'+b.id">
                                            <div class="blocker-item"
                                                 :class="{ 'off-canvas': !isAtomOnCanvas(b.id) }"
                                                 @click="if(isAtomOnCanvas(b.id)){ showAtomInfoModal=false; navigateToAtom(b.id); }">
                                                <span x-text="b.title"></span>
                                                <span class="text-sm text-muted" x-text="'(' + b.lifecycle + ')'"></span>
                                            </div>
                                        </template>
                                    </div>
                                    <button class="btn btn-sm btn-secondary mt-2"
                                            @click="traceBlockChain(selectedAtomDetails.id)">追溯阻塞鍊</button>

                                    <template x-if="blockChain && blockChain.chain && blockChain.chain.length > 0">
                                        <div class="block-chain-result mt-2">
                                            <div class="text-sm" style="font-weight:600;margin-bottom:4px;">阻塞鍊追溯</div>
                                            <template x-for="node in blockChain.chain" :key="'ai-bc-'+node.atom_id+'-'+node.depth">
                                                <div class="block-chain-node"
                                                     :style="'padding-left:' + (node.depth * 16) + 'px;'"
                                                     :class="{ 'off-canvas': !isAtomOnCanvas(node.atom_id) }"
                                                     @click="if(isAtomOnCanvas(node.atom_id)){ showAtomInfoModal=false; navigateToAtom(node.atom_id); }">
                                                    <span x-text="'--'.repeat(node.depth) + ' '"></span>
                                                    <span x-text="node.title"></span>
                                                    <span class="text-muted text-sm" x-text="'(' + node.lifecycle + ')'"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showAtomInfoModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 新增卡片 -->
    <template x-if="showNewAtomModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>新增卡片</h3>
                    <button class="modal-close" @click="showNewAtomModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>標題</label>
                        <input class="form-control" x-model="newAtom.title" placeholder="輸入標題..."
                               @keydown.enter="createNewAtom()">
                    </div>
                    <div class="form-group">
                        <label>內容</label>
                        <textarea class="form-control" x-model="newAtom.content" rows="3" placeholder="輸入內容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>類型</label>
                        <select class="form-control" x-model="newAtom.atom_type">
                            <option value="A">A - 萬用</option>
                            <option value="B">B - 發散</option>
                            <option value="C">C - 流程</option>
                            <option value="D">D - 歸納</option>
                            <option value="E">E - 套表</option>
                            <option value="F">F - 碎片</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showNewAtomModal=false">取消</button>
                    <button class="btn btn-primary" @click="createNewAtom()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 放置現有卡片 -->
    <template x-if="showAddExistingModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>放置現有卡片</h3>
                    <button class="modal-close" @click="showAddExistingModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <input class="form-control" x-model="searchQuery" placeholder="搜尋卡片..."
                               @input.debounce.300ms="doSearch()">
                    </div>
                    <div style="max-height:300px; overflow-y:auto;">
                        <template x-for="a in searchResults" :key="a.id">
                            <div class="flex items-center justify-between" style="padding:8px; border-bottom:1px solid var(--border-light);">
                                <div style="flex:1; min-width:0;">
                                    <div style="font-size:13px; font-weight:500;" x-text="a.title"></div>
                                    <div class="text-sm text-muted">
                                        <span x-text="a.atom_type + ' / ' + a.lifecycle"></span>
                                        <span x-show="a.similarity > 0" x-text="' / sim:' + (a.similarity ? a.similarity.toFixed(2) : '')" style="color:var(--accent);"></span>
                                        <span x-show="a.match_type === 'text'" style="color:var(--warning);">[text]</span>
                                    </div>
                                </div>
                                <button class="btn btn-sm btn-primary" style="margin-left:8px; flex-shrink:0;" @click="addExistingAtom(a.id)">放置</button>
                            </div>
                        </template>
                        <div x-show="searchResults.length === 0" class="empty-state" style="padding:20px;">
                            <p>沒有可放置的卡片</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showAddExistingModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 新增白板 -->
    <template x-if="showNewCanvasModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>新增白板</h3>
                    <button class="modal-close" @click="showNewCanvasModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>白板名稱</label>
                        <input class="form-control" x-model="newCanvasName" placeholder="輸入名稱..."
                               @keydown.enter="createCanvas()">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showNewCanvasModal=false">取消</button>
                    <button class="btn btn-primary" @click="createCanvas()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 標籤管理 -->
    <template x-if="showTagModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>標籤管理</h3>
                    <button class="modal-close" @click="showTagModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="flex gap-2 mb-4">
                        <input class="form-control" x-model="newTagName" placeholder="新標籤名稱..."
                               @keydown.enter="createTag()" style="flex:1;">
                        <input type="color" x-model="newTagColor"
                               style="width:36px; height:32px; border:1px solid var(--border-light); border-radius:4px; cursor:pointer;">
                        <button class="btn btn-primary" @click="createTag()">建立</button>
                    </div>
                    <template x-for="t in tags" :key="t.id">
                        <div class="flex items-center justify-between" style="padding:6px 0; border-bottom:1px solid var(--border-light);">
                            <span class="tag-badge" :style="getTagStyle(t.color)" x-text="t.name"></span>
                            <button class="btn-ghost btn-sm" @click="if(confirm('刪除標籤?')) deleteTag(t.id)">刪除</button>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showTagModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 關係類型選擇 -->
    <template x-if="showRelationModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>建立關係</h3>
                    <button class="modal-close" @click="showRelationModal=false; pendingConnection=null; mode='select'">x</button>
                </div>
                <div class="modal-body">
                    <div class="mb-4 text-sm" x-show="pendingConnection">
                        <strong x-text="getAtomTitle(pendingConnection ? pendingConnection.sourceAtomId : 0)"></strong>
                        <span class="text-muted"> --> </span>
                        <strong x-text="getAtomTitle(pendingConnection ? pendingConnection.targetAtomId : 0)"></strong>
                    </div>
                    <div class="form-group">
                        <label>關係類型</label>
                        <template x-for="rt in relationTypeList" :key="rt.value">
                            <label class="relation-option"
                                   :class="{ selected: selectedRelationType === rt.value }">
                                <input type="radio" name="relType" :value="rt.value"
                                       x-model="selectedRelationType" style="margin-right:8px;">
                                <span class="relation-color-dot" :style="'background:' + rt.color"></span>
                                <span x-text="rt.label"></span>
                                <span class="text-muted text-sm" style="margin-left:4px;" x-text="rt.desc"></span>
                            </label>
                        </template>
                    </div>
                    <div class="form-group">
                        <label>說明（選填）</label>
                        <input class="form-control" x-model="relationLabel" placeholder="關係描述..."
                               @keydown.enter="confirmConnection()">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showRelationModal=false; pendingConnection=null; mode='select'">取消</button>
                    <button class="btn btn-primary" @click="confirmConnection()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 群組編輯 -->
    <template x-if="showGroupModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>編輯群組</h3>
                    <button class="modal-close" @click="showGroupModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>名稱</label>
                        <input class="form-control" x-model="groupForm.name"
                               @keydown.enter="saveGroupEdit()">
                    </div>
                    <div class="form-group">
                        <label>顏色</label>
                        <input type="color" x-model="groupForm.color"
                               style="width:60px; height:32px; border:1px solid var(--border-light); border-radius:4px; cursor:pointer;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showGroupModal=false">取消</button>
                    <button class="btn btn-primary" @click="saveGroupEdit()">儲存</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Card Editor 彈窗 -->
    <!-- 多卡片編輯器 -->
    <template x-if="cardEditorOpen">
        <div class="card-editor-overlay" @keydown.escape.stop="closeCardEditor()">
            <!-- 頂部控制列 -->
            <div class="ce-topbar">
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:#94a3b8;border:1px solid rgba(255,255,255,0.15);"
                            @click="ceSidebarOpen = !ceSidebarOpen"
                            x-text="ceSidebarOpen ? '< 收合' : '+ 加入卡片'"></button>
                    <span class="ce-topbar-info" x-text="openEditors.length + ' 張卡片'"></span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="btn btn-sm"
                            :style="ceStagingOpen ? 'background:#1e40af;color:#93c5fd;border:1px solid #3b82f6;' : 'background:rgba(255,255,255,0.1);color:#94a3b8;border:1px solid rgba(255,255,255,0.15);'"
                            @click="toggleStaging()"
                            x-text="'擷取' + (stagingItems.length > 0 ? ' (' + stagingItems.length + ')' : '')"></button>
                    <button class="btn btn-sm" style="background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3);"
                            @click="saveAllAndClose()">全部儲存並關閉</button>
                    <button class="btn btn-sm btn-secondary" @click="discardAllAndClose()">全部不儲存並關閉</button>
                </div>
            </div>

            <div style="display:flex;flex:1;overflow:hidden;">
                <!-- 左側浮出卡片清單 -->
                <div class="ce-sidebar" :class="{ open: ceSidebarOpen }">
                    <div class="ce-sidebar-header">卡片清單</div>
                    <div class="ce-sidebar-list">
                        <template x-for="ca in sidebarAtoms" :key="'ces-'+ca.atom_id">
                            <div class="ce-sidebar-item"
                                 :class="{ active: openEditors.some(e => e.atomId === ca.atom_id) }"
                                 @click="openCardEditor(ca.atom_id)">
                                <span class="sidebar-card-type"
                                      :style="'color:' + (atomTypeConfig[ca.atom && ca.atom.atom_type] ? atomTypeConfig[ca.atom.atom_type].color : 'var(--text-muted)')"
                                      x-text="ca.atom ? ca.atom.atom_type : '?'"></span>
                                <span class="ce-sidebar-title" x-text="ca.atom ? ca.atom.title : '#'+ca.atom_id"></span>
                                <span class="ce-sidebar-badge" x-show="ca.is_blocked" style="background:#dc2626;color:#fff;font-size:8px;padding:1px 4px;border-radius:2px;">BLOCKED</span>
                                <span class="ce-sidebar-badge" x-show="openEditors.some(e => e.atomId === ca.atom_id)">已開</span>
                            </div>
                        </template>
                    </div>
                </div>
            <!-- 編輯器容器 -->
            <div class="ce-container" :class="editorLayoutClass">
                <template x-for="ed in openEditors" :key="ed.id">
                    <div class="ce-pane" :data-ce-id="ed.id"
                         :class="{ 'ce-pane-maximized': maximizedEditorId === ed.id }"
                         @mouseup="ceHandleSelection(ed.id)">
                        <!-- Pane Header -->
                        <div class="ce-pane-header">
                            <input class="card-editor-title-input"
                                   x-model="ed.title"
                                   :disabled="ed.readonly"
                                   placeholder="輸入標題..."
                                   @input="ed.dirty = true">
                            <div class="card-editor-meta">
                                <span x-text="ed.atomType"></span>
                                <span x-text="'#' + ed.atomId"></span>
                                <span x-show="ed.readonly" style="color:#d97706;font-weight:700;">唯讀</span>
                                <span x-show="ed.isBlocked" style="background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;letter-spacing:0.5px;">BLOCKED</span>
                            </div>
                            <button class="card-editor-maximize" @click="toggleMaximize(ed.id)"
                                    :title="maximizedEditorId === ed.id ? '還原' : '最大化'"
                                    x-text="maximizedEditorId === ed.id ? '&#9724;' : '&#9723;'"></button>
                            <button class="card-editor-close" @click="closeEditor(ed.id)" title="關閉此卡片">x</button>
                        </div>
                        <!-- Pane Toolbar (compact) -->
                        <div class="ce-pane-toolbar" x-show="!ed.readonly">
                            <button @click="ceCmd('bold', ed.id)" title="粗體"><b>B</b></button>
                            <button @click="ceCmd('italic', ed.id)" title="斜體"><i>I</i></button>
                            <button @click="ceCmd('underline', ed.id)" title="底線"><u>U</u></button>
                            <button @click="ceCmd('strike', ed.id)" title="刪除線"><s>S</s></button>
                            <button @click="ceCmd('code', ed.id)" title="行內程式碼">&lt;&gt;</button>
                            <button @click="ceCmd('highlight', ed.id)" title="螢光標記" style="background:#fef08a;color:#854d0e;border-radius:2px;">H</button>
                            <span class="tb-sep"></span>
                            <button @click="ceCmd('h1', ed.id)" title="H1">H1</button>
                            <button @click="ceCmd('h2', ed.id)" title="H2">H2</button>
                            <button @click="ceCmd('h3', ed.id)" title="H3">H3</button>
                            <button @click="ceCmd('h4', ed.id)" title="H4">H4</button>
                            <span class="tb-sep"></span>

                            <button @click="ceCmd('orderedList', ed.id)" title="編號">1.</button>
                            <button @click="ceCmd('taskList', ed.id)" title="任務">[]</button>
                            <span class="tb-sep"></span>
                            <button @click="ceCmd('blockquote', ed.id)" title="引用">"</button>

                            <button @click="ceCmd('table', ed.id)" title="表格">Tb</button>

                            <button @click="ceCmd('undo', ed.id)" title="復原">&#8630;</button>

                    <input class="ce-staging-title-input" x-model="stagingTitle"
                           placeholder="空白=自動命名">

                    <button class="ce-staging-mode-btn"
                            :class="{ active: stagingMode === 'copy' }"
                            @click="stagingMode = 'copy'">複製</button>
                    <button class="ce-staging-mode-btn"
                            :class="{ active: stagingMode === 'move' }"
                            @click="stagingMode = 'move'">移動</button>
                    <span class="ce-staging-bar-sep"></span>
                    <button class="ce-staging-mode-btn"
                            @click="clearStaging()"
                            :disabled="stagingItems.length === 0">清空</button>
                    <button class="ce-staging-mode-btn ce-staging-save-btn"
                            :class="{ active: stagingItems.length > 0 }"
                            @click="saveStagingAsAtom()"
                            :disabled="stagingItems.length === 0">存卡片</button>

    <!-- 匯出彈窗 -->

                </div>
                <div class="modal-body">
                    <div style="display:flex;gap:8px;margin-bottom:12px;">
                        <button class="btn btn-sm" :class="exportFormat==='json' ? 'btn-primary' : 'btn-secondary'"
                                @click="exportCanvas('json')">JSON</button>

                                @click="exportCanvas('md')">Markdown</button>
                    </div>

            <div class="modal">

                    <h3>匯入畫布 (JSON)</h3>

                </div>

            <div class="modal" style="max-width:520px;">
                <div class="modal-header">
                    <h3>批次標籤<span class="text-muted text-sm" style="margin-left:8px;" x-text="selectedAtomIds.length + ' 個已選'"></span></h3>
                    <button class="modal-close" @click="showBatchTagModal=false">x</button>
                </div>
                <div class="modal-body" style="padding:0;">
                    <!-- 分類頁籤 -->
                    <div style="display:flex;border-bottom:1px solid var(--border-light);overflow-x:auto;">
                        <template x-for="(group, idx) in tagsByCategory" :key="'btt-'+group.id">
                            <button style="padding:8px 14px;font-size:12px;white-space:nowrap;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-secondary);"
                                    :style="batchTagActiveTab === idx ? 'border-bottom-color:var(--accent);color:var(--accent);font-weight:600;' : ''"
                                    @click="batchTagActiveTab = idx"
                                    x-text="group.name + ' (' + group.tags.length + ')'"></button>
                        </template>
                    </div>
                    <!-- 標籤陣列 -->
                    <div style="padding:12px;">
                        <template x-for="(group, idx) in tagsByCategory" :key="'btg-'+group.id">
                            <div x-show="batchTagActiveTab === idx"
                                 style="display:flex;flex-wrap:wrap;gap:6px;">
                                <template x-for="t in group.tags" :key="'btgt-'+t.id">
                                    <button class="batch-tag-btn"
                                            :class="{ 'batch-tag-active': (function() {
                                                var count = 0;
                                                var arr = $data.atoms;
                                                var sel = $data.selectedAtomIds;
                                                for (var i = 0; i < arr.length; i++) {
                                                    if (sel.includes(arr[i].atom_id) && arr[i].atom && (arr[i].atom.tags || []).some(function(x){ return x.id === t.id; })) count++;
                                                }
                                                return count > 0;
                                            })() }"
                                            :style="getTagStyle(t.color)"
                                            @click="batchToggleTag(t.id)"
                                            x-text="t.name"></button>
                                </template>
                                <div x-show="group.tags.length === 0" class="text-sm text-muted" style="padding:8px;">此分類沒有標籤</div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showBatchTagModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 右鍵選單 -->
    <template x-if="contextMenu">
        <div class="context-menu" :style="'left:' + contextMenu.x + 'px; top:' + contextMenu.y + 'px;'" @click.stop>
            <template x-if="contextMenu.type === 'canvas'">
                <div>
                    <div class="context-menu-item" @click="contextAddAtom()">新增卡片</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="fitView(); closeContextMenu()">適應視圖</div>
                    <div class="context-menu-item" @click="resetZoom(); closeContextMenu()">重置縮放</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="exportCanvas('json'); closeContextMenu()">匯出 JSON</div>
                    <div class="context-menu-item" @click="exportCanvas('md'); closeContextMenu()">匯出 Markdown</div>
                </div>
            </template>
            <template x-if="contextMenu.type === 'card'">
                <div>
                    <div class="context-menu-item" @click="openCardEditor(contextMenu.ca.atom_id); closeContextMenu()">開啟卡片</div>
                    <div class="context-menu-item" @click="selectCard(contextMenu.ca.atom_id); closeContextMenu()">側欄編輯</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="removeFromCanvas(contextMenu.ca); closeContextMenu()">從白板移除</div>
                    <div class="context-menu-item danger"
                         @click="if(confirm('刪除此卡片? 所有白板都會移除')) { deleteAtomEntirely(contextMenu.ca); closeContextMenu(); }">刪除卡片</div>
                </div>
            </template>
            <template x-if="contextMenu.type === 'group'">
                <div>
                    <div class="context-menu-item" @click="openGroupEditModal(contextMenu.group); closeContextMenu()">編輯群組</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="ungroupAtoms(contextMenu.group.id); closeContextMenu()">解散群組</div>
                </div>
            </template>
        </div>
    </template>
