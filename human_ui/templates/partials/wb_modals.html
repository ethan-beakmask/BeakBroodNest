    <!-- ============================================ -->
    <!-- Modals -->
    <!-- ============================================ -->

    <!-- 卡片資訊對話框（雙擊卡片觸發） -->
    <template x-if="showAtomInfoModal && selectedAtomDetails">
        <div class="modal-overlay">
            <div class="modal atom-info-modal">
                <div class="modal-header">
                    <h3 x-text="selectedAtomDetails.title || '(無標題)'"></h3>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <button class="btn btn-sm btn-primary" style="font-size:11px;padding:2px 10px;"
                                @click="showAtomInfoModal=false; openCardEditor(selectedAtomDetails.id)">開啟編輯器</button>
                        <button class="modal-close" @click="showAtomInfoModal=false">x</button>
                    </div>
                </div>
                <div class="modal-body" style="padding:0;">
                    <div class="atom-info-layout">
                        <!-- 左欄：基本資訊 -->
                        <div class="atom-info-left">
                            <!-- Owner 唯讀警告 -->
                            <div class="wb-panel-readonly-notice"
                                 x-show="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'">
                                <span>唯讀</span> -- 屬於 <strong x-text="ownerDisplayName(selectedAtomDetails.owner)"></strong>
                            </div>

                            <div class="form-group">
                                <label>標題</label>
                                <input class="form-control"
                                       :value="selectedAtomDetails.title || ''"
                                       :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                       @change="updateAtomFieldById(selectedAtomDetails.id, 'title', $event.target.value)">
                            </div>
                            <div class="form-group">
                                <label>內容</label>
                                <textarea class="form-control" rows="6"
                                          :value="selectedAtomDetails.content || ''"
                                          :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                          @change="updateAtomFieldById(selectedAtomDetails.id, 'content', $event.target.value)"></textarea>
                            </div>
                            <div style="display:flex;gap:8px;">
                                <div class="form-group" style="flex:1;">
                                    <label>類型</label>
                                    <select class="form-control"
                                            :value="selectedAtomDetails.atom_type || 'F'"
                                            :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                            @change="updateAtomFieldById(selectedAtomDetails.id, 'atom_type', $event.target.value)">
                                        <option value="A">A - 萬用</option>
                                        <option value="B">B - 發散</option>
                                        <option value="C">C - 流程</option>
                                        <option value="D">D - 歸納</option>
                                        <option value="E">E - 套表</option>
                                        <option value="F">F - 碎片</option>
                                    </select>
                                </div>
                                <div class="form-group" style="flex:1;">
                                    <label>生命週期</label>
                                    <select class="form-control"
                                            :value="selectedAtomDetails.lifecycle || 'active'"
                                            :disabled="selectedAtomDetails.owner && selectedAtomDetails.owner !== 'ethan'"
                                            @change="updateAtomFieldById(selectedAtomDetails.id, 'lifecycle', $event.target.value)">
                                        <option value="active">active</option>
                                        <option value="aging">aging</option>
                                        <option value="archived">archived</option>
                                        <option value="terminal">terminal</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 標籤 -->
                            <div class="form-group">
                                <label>標籤</label>
                                <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                    <template x-for="t in tags" :key="'ai-t-'+t.id">
                                        <span class="tag-badge"
                                              :style="getTagStyle(t.color) + 'cursor:pointer;'"
                                              :class="{ selected: selectedAtomDetails.tags && selectedAtomDetails.tags.some(at => at.id === t.id) }"
                                              @click="toggleAtomTagById(selectedAtomDetails.id, t.id)"
                                              x-show="selectedAtomDetails.owner === 'ethan' || (selectedAtomDetails.tags && selectedAtomDetails.tags.some(at => at.id === t.id))">
                                            <span x-show="selectedAtomDetails.tags && selectedAtomDetails.tags.some(at => at.id === t.id)">v </span>
                                            <span x-text="t.name"></span>
                                        </span>
                                    </template>
                                </div>
                            </div>

                            <!-- 資訊 -->
                            <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light);">
                                <div class="text-sm text-muted">
                                    <span>Vitality: <strong x-text="selectedAtomDetails.vitality_score != null ? selectedAtomDetails.vitality_score.toFixed(2) : '-'"></strong></span>
                                    <span style="margin-left:12px;">擁有者: <span x-text="ownerDisplayName(selectedAtomDetails.owner)"></span></span>
                                    <span style="margin-left:12px;">來源: <span x-text="selectedAtomDetails.source || ''"></span></span>
                                </div>
                                <div class="text-sm text-muted" style="margin-top:2px;">
                                    <span>建立: <span x-text="formatDate(selectedAtomDetails.created_at)"></span></span>
                                    <span style="margin-left:12px;">更新: <span x-text="formatDate(selectedAtomDetails.updated_at)"></span></span>
                                </div>
                            </div>
                        </div>

                        <!-- 右欄：關係 + 阻塞 -->
                        <div class="atom-info-right">
                            <!-- 因果關係 -->
                            <div style="margin-bottom:12px;">
                                <div class="wb-panel-section-title">因果關係</div>

                                <template x-if="selectedAtomDetails.relations_from && selectedAtomDetails.relations_from.length > 0">
                                    <div class="relation-list">
                                        <div class="relation-list-title">出 --></div>
                                        <template x-for="r in selectedAtomDetails.relations_from" :key="'ai-rf-'+r.id">
                                            <div class="relation-item"
                                                 :class="{ 'off-canvas': !isAtomOnCanvas(r.to_atom_id) }"
                                                 @click="if(isAtomOnCanvas(r.to_atom_id)){ showAtomInfoModal=false; navigateToAtom(r.to_atom_id); }">
                                                <span class="relation-type-badge" x-text="relationLabelMap[r.relation_type] || r.relation_type"></span>
                                                <span class="relation-target" x-text="r.to_atom ? r.to_atom.title : '#' + r.to_atom_id"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template x-if="selectedAtomDetails.relations_to && selectedAtomDetails.relations_to.length > 0">
                                    <div class="relation-list mt-2">
                                        <div class="relation-list-title">入 <--</div>
                                        <template x-for="r in selectedAtomDetails.relations_to" :key="'ai-rt-'+r.id">
                                            <div class="relation-item"
                                                 :class="{ 'off-canvas': !isAtomOnCanvas(r.from_atom_id) }"
                                                 @click="if(isAtomOnCanvas(r.from_atom_id)){ showAtomInfoModal=false; navigateToAtom(r.from_atom_id); }">
                                                <span class="relation-type-badge" x-text="relationLabelMap[r.relation_type] || r.relation_type"></span>
                                                <span class="relation-target" x-text="r.from_atom ? r.from_atom.title : '#' + r.from_atom_id"></span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <div x-show="(!selectedAtomDetails.relations_from || selectedAtomDetails.relations_from.length === 0) && (!selectedAtomDetails.relations_to || selectedAtomDetails.relations_to.length === 0)"
                                     class="text-sm text-muted mt-2">尚無關係</div>
                            </div>

                            <!-- 阻塞狀態 -->
                            <template x-if="selectedAtomDetails.is_blocked">
                                <div>
                                    <div class="wb-panel-section-title">阻塞狀態</div>
                                    <div class="block-status-badge">已阻塞</div>
                                    <div class="mt-2">
                                        <template x-for="b in (selectedAtomDetails.blockers || [])" :key="'ai-bl-'+b.id">
                                            <div class="blocker-item"
                                                 :class="{ 'off-canvas': !isAtomOnCanvas(b.id) }"
                                                 @click="if(isAtomOnCanvas(b.id)){ showAtomInfoModal=false; navigateToAtom(b.id); }">
                                                <span x-text="b.title"></span>
                                                <span class="text-sm text-muted" x-text="'(' + b.lifecycle + ')'"></span>
                                            </div>
                                        </template>
                                    </div>
                                    <button class="btn btn-sm btn-secondary mt-2"
                                            @click="traceBlockChain(selectedAtomDetails.id)">追溯阻塞鍊</button>

                                    <template x-if="blockChain && blockChain.chain && blockChain.chain.length > 0">
                                        <div class="block-chain-result mt-2">
                                            <div class="text-sm" style="font-weight:600;margin-bottom:4px;">阻塞鍊追溯</div>
                                            <template x-for="node in blockChain.chain" :key="'ai-bc-'+node.atom_id+'-'+node.depth">
                                                <div class="block-chain-node"
                                                     :style="'padding-left:' + (node.depth * 16) + 'px;'"
                                                     :class="{ 'off-canvas': !isAtomOnCanvas(node.atom_id) }"
                                                     @click="if(isAtomOnCanvas(node.atom_id)){ showAtomInfoModal=false; navigateToAtom(node.atom_id); }">
                                                    <span x-text="'--'.repeat(node.depth) + ' '"></span>
                                                    <span x-text="node.title"></span>
                                                    <span class="text-muted text-sm" x-text="'(' + node.lifecycle + ')'"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showAtomInfoModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 新增卡片 -->
    <template x-if="showNewAtomModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>新增卡片</h3>
                    <button class="modal-close" @click="showNewAtomModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>標題</label>
                        <input class="form-control" x-model="newAtom.title" placeholder="輸入標題..."
                               @keydown.enter="createNewAtom()">
                    </div>
                    <div class="form-group">
                        <label>內容</label>
                        <textarea class="form-control" x-model="newAtom.content" rows="3" placeholder="輸入內容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>類型</label>
                        <select class="form-control" x-model="newAtom.atom_type">
                            <option value="A">A - 萬用</option>
                            <option value="B">B - 發散</option>
                            <option value="C">C - 流程</option>
                            <option value="D">D - 歸納</option>
                            <option value="E">E - 套表</option>
                            <option value="F">F - 碎片</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showNewAtomModal=false">取消</button>
                    <button class="btn btn-primary" @click="createNewAtom()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 交換卡片 Modal：寄存 + 取出（兩 tab） -->
    <template x-if="showExchangeModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:880px;">
                <div class="modal-header">
                    <h3>交換</h3>
                    <button class="modal-close" @click="closeExchangeModal()">x</button>
                </div>

                <!-- Tab 切換 -->
                <div class="ex-tabs">
                    <button class="ex-tab"
                            :class="{ active: exchangeTab === 'stash' }"
                            :disabled="!exchangeStashAvailable"
                            :title="exchangeStashAvailable ? '' : '需先選取卡片才能寄存'"
                            @click="if(exchangeStashAvailable){exchangeTab='stash';}">寄存</button>
                    <button class="ex-tab"
                            :class="{ active: exchangeTab === 'take' }"
                            @click="exchangeTab='take'; exchangeView='list';">取出</button>
                </div>

                <div class="modal-body" style="padding:16px;">

                    <!-- 寄存 tab -->
                    <template x-if="exchangeTab === 'stash'">
                        <div>
                            <div class="form-group">
                                <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">交換包名稱</label>
                                <input class="form-control" x-model="exchangeStashName"
                                       maxlength="300"
                                       placeholder="輸入名稱（同名允許）">
                            </div>
                            <div class="form-group" style="margin-top:12px;">
                                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                                    <input type="radio" x-model="exchangeStashMode" value="copy">
                                    <span><strong>複製</strong>到交換包（卡片仍留在當前白板）</span>
                                </label>
                                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:6px;">
                                    <input type="radio" x-model="exchangeStashMode" value="move">
                                    <span><strong>移動</strong>到交換包（從當前白板解除連結）</span>
                                </label>
                            </div>
                            <div style="margin-top:12px;font-size:13px;color:var(--text-muted);"
                                 x-text="'將寄存 ' + (selectedAtomIds.length || (selectedAtomId ? 1 : 0)) + ' 張卡片'"></div>
                        </div>
                    </template>

                    <!-- 取出 tab -->
                    <template x-if="exchangeTab === 'take'">
                        <div>
                            <!-- list view：所有交換包 -->
                            <template x-if="exchangeView === 'list'">
                                <div>
                                    <div x-show="exchangePacks.length === 0" class="empty-state"
                                         style="padding:32px;text-align:center;color:var(--text-muted);">
                                        尚無交換包
                                    </div>
                                    <div x-show="exchangePacks.length > 0" class="ex-pack-grid">
                                        <template x-for="p in exchangePacks" :key="p.id">
                                            <div class="ex-pack-card" @click="openExchangePackDetail(p.id)">
                                                <div class="ex-pack-name" x-text="p.name"></div>
                                                <div class="ex-pack-meta">
                                                    <span x-text="p.atom_count + ' 張'"></span>
                                                    <span x-show="p.source_canvas_name"
                                                          x-text="' · 來自 ' + p.source_canvas_name"></span>
                                                </div>
                                                <div class="ex-pack-time"
                                                     x-text="(p.created_at || '').replace('T',' ').substring(0,16)"></div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- detail view：包內卡片清單 -->
                            <template x-if="exchangeView === 'detail' && exchangePackDetail">
                                <div>
                                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                                        <button class="btn-ghost btn-sm" @click="exchangeView='list'; exchangePackDetail=null;">&laquo; 返回</button>
                                        <strong x-text="exchangePackDetail.name"></strong>
                                        <span class="text-muted" style="font-size:12px;"
                                              x-text="'（' + (exchangePackDetail.items || []).length + ' 張）'"></span>
                                    </div>

                                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                                        <button class="btn-ghost btn-sm" @click="toggleSelectAllExchangeAtoms()">
                                            <span x-text="exchangeSelectedAtomIds.length === (exchangePackDetail.items||[]).length && (exchangePackDetail.items||[]).length > 0 ? '取消全選' : '全選'"></span>
                                        </button>
                                        <span style="font-size:12px;color:var(--text-muted);"
                                              x-text="'已選 ' + exchangeSelectedAtomIds.length + ' 張'"></span>
                                    </div>

                                    <div x-show="(exchangePackDetail.items || []).length === 0" class="empty-state"
                                         style="padding:24px;text-align:center;color:var(--text-muted);">
                                        此包是空的
                                    </div>

                                    <div class="ex-detail-grid">
                                        <template x-for="it in (exchangePackDetail.items || [])" :key="it.id">
                                            <div class="ex-detail-card"
                                                 :class="{ selected: exchangeSelectedAtomIds.includes(it.id) }"
                                                 @click="toggleExchangeAtomSelect(it.id)">
                                                <div class="ex-detail-thumb">
                                                    <template x-if="it.thumbnail_url">
                                                        <img :src="it.thumbnail_url" :alt="it.title" draggable="false">
                                                    </template>
                                                    <template x-if="!it.thumbnail_url">
                                                        <div class="ex-detail-thumb-text" x-text="it.title || '(無標題)'"></div>
                                                    </template>
                                                </div>
                                                <div class="ex-detail-meta">
                                                    <div class="ex-detail-title" :title="it.title" x-text="it.title || '(無標題)'"></div>
                                                    <div class="ex-detail-sub">
                                                        <span x-text="it.atom_type + ' / ' + it.lifecycle"></span>
                                                    </div>
                                                </div>
                                                <div class="ex-detail-checkbox">
                                                    <input type="checkbox"
                                                           :checked="exchangeSelectedAtomIds.includes(it.id)"
                                                           @click.stop="toggleExchangeAtomSelect(it.id)">
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Footer：依 tab + view 顯示不同按鈕 -->
                <div class="modal-footer">
                    <template x-if="exchangeTab === 'stash'">
                        <div style="display:flex;gap:8px;width:100%;justify-content:flex-end;">
                            <button class="btn btn-secondary" @click="closeExchangeModal()">取消</button>
                            <button class="btn btn-primary"
                                    :disabled="!exchangeStashName.trim()"
                                    @click="confirmExchangeStash()">確認寄存</button>
                        </div>
                    </template>
                    <template x-if="exchangeTab === 'take' && exchangeView === 'list'">
                        <div style="display:flex;gap:8px;width:100%;justify-content:flex-end;">
                            <button class="btn btn-secondary" @click="closeExchangeModal()">關閉</button>
                        </div>
                    </template>
                    <template x-if="exchangeTab === 'take' && exchangeView === 'detail'">
                        <div style="display:flex;gap:8px;width:100%;justify-content:space-between;">
                            <button class="btn btn-sm" style="color:var(--danger);"
                                    @click="confirmDeleteExchangePack()">刪整包</button>
                            <div style="display:flex;gap:8px;">
                                <button class="btn btn-sm" style="color:var(--danger);"
                                        :disabled="exchangeSelectedAtomIds.length === 0"
                                        @click="confirmRemoveAtomsFromPack()">從包刪除選中</button>
                                <button class="btn btn-primary"
                                        :disabled="exchangeSelectedAtomIds.length === 0"
                                        @click="confirmTakeFromExchange()">取用選中</button>
                                <button class="btn btn-secondary" @click="closeExchangeModal()">關閉</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- 徹底刪除卡片防呆 Modal -->
    <template x-if="showHardDeleteModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:680px;">
                <div class="modal-header">
                    <h3 style="color:#dc2626;">徹底刪除卡片 -- 防呆檢查</h3>
                    <button class="modal-close" @click="closeHardDeleteModal()">x</button>
                </div>
                <div class="modal-body" style="padding:16px;">

                    <div style="margin-bottom:12px;padding:10px;background:#fef2f2;border-left:3px solid #dc2626;border-radius:4px;">
                        <div style="font-size:13px;font-weight:600;color:#7f1d1d;">
                            卡片：<span x-text="hardDeleteAtomTitle || '(無標題)'"></span>
                            <span class="text-muted" style="font-weight:normal;font-size:11px;"
                                  x-text="' (id: ' + hardDeleteAtomId + ')'"></span>
                        </div>
                    </div>

                    <template x-if="!hardDeleteUsage">
                        <div class="empty-state" style="padding:24px;text-align:center;">載入中...</div>
                    </template>

                    <template x-if="hardDeleteUsage">
                        <div>
                            <!-- 白板清單 -->
                            <div style="margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
                                <div style="font-size:13px;font-weight:600;">
                                    出現在 <span x-text="hardDeleteUsage.canvases.length"></span> 個白板上：
                                </div>
                                <button class="btn-ghost btn-sm" @click="toggleSelectAllHardDeleteCanvases()">
                                    <span x-text="hardDeleteSelectedCanvasIds.length === hardDeleteUsage.canvases.length && hardDeleteUsage.canvases.length > 0 ? '取消全選' : '全選'"></span>
                                </button>
                            </div>

                            <div x-show="hardDeleteUsage.canvases.length === 0" class="empty-state"
                                 style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px;">
                                未在任何白板使用
                            </div>

                            <div class="hd-canvas-list">
                                <template x-for="c in hardDeleteUsage.canvases" :key="c.canvas_id">
                                    <label class="hd-canvas-row"
                                           :class="{ selected: hardDeleteSelectedCanvasIds.includes(c.canvas_id) }">
                                        <input type="checkbox"
                                               :checked="hardDeleteSelectedCanvasIds.includes(c.canvas_id)"
                                               @change="toggleHardDeleteCanvas(c.canvas_id)">
                                        <span class="hd-canvas-name" x-text="c.name"></span>
                                        <span class="hd-canvas-meta" x-text="c.connection_count + ' 條連線'"></span>
                                    </label>
                                </template>
                            </div>

                            <!-- 交換包與白板字紙簍（資訊性，全選刪除時連帶清除） -->
                            <div x-show="hardDeleteUsage.exchange_packs.length > 0 || hardDeleteUsage.canvas_trashes.length > 0"
                                 style="margin-top:14px;padding:10px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:4px;font-size:12px;">
                                <div style="font-weight:600;margin-bottom:6px;color:var(--text-muted);">其他引用（僅在「徹底刪除」時連帶清除）：</div>
                                <div x-show="hardDeleteUsage.exchange_packs.length > 0" style="margin-bottom:4px;">
                                    交換包 (<span x-text="hardDeleteUsage.exchange_packs.length"></span>)：
                                    <template x-for="p in hardDeleteUsage.exchange_packs" :key="p.pack_id">
                                        <span class="hd-tag" x-text="p.name"></span>
                                    </template>
                                </div>
                                <div x-show="hardDeleteUsage.canvas_trashes.length > 0">
                                    字紙簍 (<span x-text="hardDeleteUsage.canvas_trashes.length"></span>)：
                                    <template x-for="t in hardDeleteUsage.canvas_trashes" :key="t.trash_id">
                                        <span class="hd-tag" x-text="t.name"></span>
                                    </template>
                                </div>
                            </div>

                            <!-- 動作說明（依當前選擇變化） -->
                            <div style="margin-top:14px;padding:12px;border-radius:4px;font-size:13px;line-height:1.6;"
                                 :style="hardDeleteIsAllSelected ? 'background:#fee2e2;border:1px solid #dc2626;color:#7f1d1d;' : 'background:#fef9c3;border:1px solid #ca8a04;color:#713f12;'">
                                <template x-if="hardDeleteIsAllSelected">
                                    <div>
                                        <strong>將從 DB 徹底刪除卡片本體</strong>，所有引用連帶清除：所有白板、<span x-text="hardDeleteUsage.exchange_packs.length"></span> 個交換包、<span x-text="hardDeleteUsage.canvas_trashes.length"></span> 個白板字紙簍。<strong>不可逆。</strong>

    <!-- 關係類型選擇（Shift+拖拉時） -->
    <template x-if="showRelationModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:560px;">
                <div class="modal-header">
                    <h3>建立關係</h3>
                    <button class="modal-close" @click="showRelationModal=false; pendingConnection=null; mode='select'">x</button>
                </div>
                <div class="modal-body">
                    <div class="mb-4 text-sm" x-show="pendingConnection">
                        <strong x-text="getAtomTitle(pendingConnection ? pendingConnection.sourceAtomId : 0)"></strong>

                    <div class="form-group">
                        <table style="width:100%;font-size:13px;border-collapse:collapse;">
                            <thead>
                                <tr style="border-bottom:1px solid var(--border-light, #dee2e6);text-align:left;">
                                    <th style="padding:4px 6px;width:30px;"></th>
                                    <th style="padding:4px 6px;">類型</th>
                                    <th style="padding:4px 6px;">relation_type</th>
                                    <th style="padding:4px 6px;">語意</th>
                                    <th style="padding:4px 6px;">含義</th>
                                    <th style="padding:4px 6px;text-align:center;">排程</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="rt in relationTypeList" :key="'cr-'+rt.value">
                                    <tr style="border-bottom:1px solid var(--bg-tertiary, #f1f3f5);cursor:pointer;"
                                        :style="selectedRelationType === rt.value ? 'background:var(--accent-bg, #eff6ff);' : ''"
                                        @click="selectedRelationType = rt.value">
                                        <td style="padding:4px 6px;">
                                            <input type="radio" name="relType" :value="rt.value"
                                                   x-model="selectedRelationType">
                                        </td>
                                        <td style="padding:4px 6px;white-space:nowrap;">
                                            <span class="relation-color-dot" :style="'background:' + rt.color"></span>
                                            <span x-text="rt.label" style="font-weight:600;"></span>
                                        </td>
                                        <td style="padding:4px 6px;font-size:11px;color:var(--text-muted, #6c757d);font-family:monospace;" x-text="rt.value"></td>
                                        <td style="padding:4px 6px;font-size:12px;color:var(--text-secondary, #495057);" x-text="rt.desc"></td>
                                        <td style="padding:4px 6px;font-size:11px;color:var(--text-muted, #6c757d);" x-text="rt.strength"></td>
                                        <td style="padding:4px 6px;text-align:center;">
                                            <span x-show="rt.sched" style="color:#dc2626;font-weight:700;font-size:12px;">V</span>
                                            <span x-show="!rt.sched" style="color:#adb5bd;font-size:11px;">-</span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="form-group">
                        <label>說明（選填）</label>
                        <input class="form-control" x-model="relationLabel" placeholder="關係描述..."
                               @keydown.enter="confirmConnection()">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showRelationModal=false; pendingConnection=null; mode='select'">取消</button>
                    <button class="btn btn-primary" @click="confirmConnection()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Card Editor 彈窗 -->
    <!-- 多卡片編輯器 -->
    <template x-if="cardEditorOpen">
        <div class="card-editor-overlay" @keydown.escape.stop="closeCardEditor()">
            <!-- 頂部控制列 -->
            <div class="ce-topbar">
                <div style="display:flex;align-items:center;gap:8px;">
                    <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);color:#94a3b8;border:1px solid rgba(255,255,255,0.15);"
                            @click="ceSidebarOpen = !ceSidebarOpen"
                            x-text="ceSidebarOpen ? '< 收合' : '+ 加入卡片'"></button>
                    <span class="ce-topbar-info" x-text="openEditors.length + ' 張卡片'"></span>
                    <div class="ce-layout-btns" x-show="openEditors.length > 1">
                        <button class="ce-layout-btn" :class="{ active: editorLayout === 'row' }" @click="editorLayout = 'row'" title="左右">&#9776;</button>
                        <button class="ce-layout-btn" :class="{ active: editorLayout === 'col' }" @click="editorLayout = 'col'" title="上下">&#9783;</button>
                        <button class="ce-layout-btn" :class="{ active: editorLayout === 'grid2' }" @click="editorLayout = 'grid2'" title="田字">&#9638;</button>
                        <button class="ce-layout-btn" :class="{ active: editorLayout === 'grid3' }" @click="editorLayout = 'grid3'" title="井字">&#9641;</button>
                        <button class="ce-layout-btn" :class="{ active: editorLayout === 'custom' }" @click="editorLayout = 'custom'" title="自訂">&#9881;</button>
                        <template x-if="editorLayout === 'custom'">
                            <span style="display:inline-flex;align-items:center;gap:3px;margin-left:4px;">
                                <input type="number" min="1" max="8" x-model.number="customLayoutCols"
                                       style="width:36px;background:rgba(255,255,255,0.1);color:#e2e8f0;border:1px solid rgba(255,255,255,0.2);border-radius:3px;text-align:center;font-size:11px;padding:2px;">
                                <span style="color:#94a3b8;font-size:11px;">x</span>
                                <input type="number" min="1" max="8" x-model.number="customLayoutRows"
                                       style="width:36px;background:rgba(255,255,255,0.1);color:#e2e8f0;border:1px solid rgba(255,255,255,0.2);border-radius:3px;text-align:center;font-size:11px;padding:2px;">
                            </span>
                        </template>
                        <button class="ce-layout-btn" :class="{ active: editorLayout === 'auto' }" @click="editorLayout = 'auto'" title="自動">A</button>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <label class="ce-topbar-transcribe"
                           :class="{ disabled: openEditors.length !== 2 }"
                           :title="openEditors.length !== 2 ? '需開啟 2 個文件' : '選取文字直接謄寫到另一文件'">
                        <input type="checkbox" x-model="transcribeMode"
                               :disabled="openEditors.length !== 2">
                        <span>謄寫</span>
                    </label>
                    <label class="ce-topbar-transcribe"
                           :class="{ disabled: !transcribeMode || openEditors.length !== 2 }"
                           title="貼上後在同段落追加 hard break（\\n）">
                        <input type="checkbox" x-model="transcribeNewline"
                               :disabled="!transcribeMode || openEditors.length !== 2">
                        <span>換列</span>
                    </label>
                    <button class="btn btn-sm"
                            :style="ceStagingOpen ? 'background:#1e40af;color:#93c5fd;border:1px solid #3b82f6;' : 'background:rgba(255,255,255,0.1);color:#94a3b8;border:1px solid rgba(255,255,255,0.15);'"
                            @click="toggleStaging()"
                            x-text="'擷取' + (stagingItems.length > 0 ? ' (' + stagingItems.length + ')' : '')"></button>
                    <button class="btn btn-sm" style="background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3);"
                            @click="saveAllAndClose()" title="Ctrl+K, S">全部儲存並關閉</button>
                    <button class="btn btn-sm btn-secondary" @click="_confirmDiscardAndClose()" title="Ctrl+K, Q">全部捨棄變更</button>
                </div>
            </div>

            <div style="display:flex;flex:1;overflow:hidden;">
                <!-- 左側浮出卡片清單 -->
                <div class="ce-sidebar" :class="{ open: ceSidebarOpen }">
                    <div class="ce-sidebar-header">卡片清單</div>
                    <div class="ce-sidebar-list">
                        <template x-for="ca in sidebarAtoms" :key="'ces-'+ca.atom_id">
                            <div class="ce-sidebar-item"
                                 :class="{ active: openEditors.some(e => e.atomId === ca.atom_id) }"
                                 @click="openCardEditor(ca.atom_id)">
                                <span class="sidebar-card-type"
                                      :style="'color:' + (atomTypeConfig[ca.atom && ca.atom.atom_type] ? atomTypeConfig[ca.atom.atom_type].color : 'var(--text-muted)')"
                                      x-text="ca.atom ? ca.atom.atom_type : '?'"></span>
                                <span class="ce-sidebar-title" x-text="ca.atom ? ca.atom.title : '#'+ca.atom_id"></span>
                                <span class="ce-sidebar-badge" x-show="ca.is_blocked" style="background:#dc2626;color:#fff;font-size:8px;padding:1px 4px;border-radius:2px;">BLOCKED</span>
                                <span class="ce-sidebar-badge" x-show="openEditors.some(e => e.atomId === ca.atom_id)">已開</span>
                            </div>
                        </template>
                    </div>
                </div>
            <!-- 編輯器容器 -->
            <div class="ce-container" :class="editorLayoutClass" :style="customGridStyle">
                <template x-for="ed in openEditors" :key="ed.id">
                    <div class="ce-pane" :data-ce-id="ed.id"
                         :data-continuous="(ceColorPen[ed.id] || ceColorHl[ed.id]) ? '1' : '0'"
                         :class="{ 'ce-pane-maximized': maximizedEditorId === ed.id }"
                         @mouseup="ceHandleSelection(ed.id)">
                        <!-- Pane Header -->
                        <div class="ce-pane-header">
                            <input class="card-editor-title-input"
                                   x-model="ed.title"
                                   :disabled="ed.readonly"
                                   placeholder="輸入標題..."
                                   @input="ed.dirty = true"
                                   @keydown.enter.prevent="focusEditorContent(ed.id)">
                            <div class="card-editor-meta">
                                <span x-text="ed.atomType"></span>
                                <span x-text="'#' + ed.atomId"></span>
                                <span x-show="ed.readonly" style="color:#d97706;font-weight:700;">唯讀</span>
                                <span x-show="ed.isBlocked" style="background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;letter-spacing:0.5px;">BLOCKED</span>
                            </div>
                            <button class="card-editor-maximize" @click="toggleMaximize(ed.id)"
                                    :title="maximizedEditorId === ed.id ? '還原' : '最大化'"
                                    x-text="maximizedEditorId === ed.id ? '&#9724;' : '&#9723;'"></button>
                            <button class="card-editor-close" @click="closeEditor(ed.id)" title="關閉此卡片">x</button>
                        </div>
                        <!-- PDF 媒體卡片專屬工具列（取代普通 toolbar） -->
                        <div class="ce-pane-toolbar ce-pane-toolbar-pdf" x-show="ceIsPdfMediaEditor(ed.id)">
                            <button @click="cePdfCrop(ed.id)"
                                    :disabled="!ceIsPdfReaderEditor(ed.id)"
                                    :title="ceIsPdfReaderEditor(ed.id) ? '框選 PDF 區域截圖到擷取/謄寫' : '需切換到「閱讀器」模式才能截圖'">
                                &#9986; 截圖
                            </button>
                            <span class="tb-sep"></span>
                            <button @click="ceTogglePdfViewMode(ed.id)" :disabled="ed.readonly"
                                    title="reader / thumbnail 切換"
                                    x-text="ceIsPdfReaderEditor(ed.id) ? '切為縮圖' : '切為閱讀器'"></button>
                            <span class="tb-sep"></span>
                            <button @click="ceIndexPdfText(ed.id)" :disabled="ed.readonly"
                                    :title="ceIsPdfIndexed(ed.id) ? '重新抽取全文寫入搜尋索引' : '抽取 PDF 全文存入 atom.content，使 note_search 能命中'"
                                    x-text="ceIsPdfIndexed(ed.id) ? '已索引（重新索引）' : '索引內文 (OCR)'"></button>
                            <span style="flex:1;"></span>
                            <span style="font-size:11px;color:#94a3b8;">PDF 媒體卡片</span>
                        </div>
                        <!-- Pane Toolbar (compact) -->
                        <div class="ce-pane-toolbar" x-show="!ed.readonly && !ceIsPdfMediaEditor(ed.id)">
                            <button @click="ceCmd('bold', ed.id)" title="粗體"><b>B</b></button>
                            <button @click="ceCmd('italic', ed.id)" title="斜體"><i>I</i></button>
                            <button @click="ceCmd('underline', ed.id)" title="底線"><u>U</u></button>
                            <button @click="ceCmd('strike', ed.id)" title="刪除線"><s>S</s></button>
                            <button @click="ceCmd('code', ed.id)" title="行內程式碼">&lt;&gt;</button>
                            <span class="tb-sep"></span>
                            <span class="tb-heading-zone">
                                <button class="tb-heading" @click="ceCmd('h1', ed.id)" title="H1">H1</button>
                                <button class="tb-heading" @click="ceCmd('h2', ed.id)" title="H2">H2</button>
                                <button class="tb-heading" @click="ceCmd('h3', ed.id)" title="H3">H3</button>
                                <button class="tb-heading" @click="ceCmd('h4', ed.id)" title="H4">H4</button>
                                <button class="tb-heading tb-heading-nav" @click="ceCmd('sectionNav', ed.id)" title="章節導覽（列出所有 H1~H4 標題並可點擊跳轉）">節</button>
                            </span>
                            <span class="tb-sep"></span>
                            <button @click="ceCmd('bulletList', ed.id)" title="清單 (Ctrl+Shift+6,三層自動 •/◦/▪)">&bull;</button>
                            <button @click="ceCmd('orderedList', ed.id)" title="編號 (Ctrl+Shift+7,三層自動 1./a./i.)">1.</button>
                            <button @click="ceCmd('taskList', ed.id)" title="任務">[]</button>
                            <span class="tb-sep"></span>
                            <button @click="ceCmd('blockquote', ed.id)" title="引用">"</button>
                            <button @click="ceCmd('codeBlock', ed.id)" title="程式區塊">{}</button>
                            <button @click="ceCmd('hr', ed.id)" title="分隔線">--</button>
                            <span class="tb-sep"></span>
                            <button @click="ceInsertLink(ed.id)" title="連結">Lk</button>
                            <button @click="ceInsertImage(ed.id)" title="插入圖片 (URL)">Img</button>
                            <button @click="ceUploadImage(ed.id)" title="上傳圖片">Img&uarr;</button>
                            <button @click="ceUploadFile(ed.id)" title="上傳檔案附件">&#128206;</button>
                            <span class="tb-sep"></span>
                            <button @click="ceCmd('undo', ed.id)" title="復原">&#8630;</button>
                            <button @click="ceCmd('redo', ed.id)" title="重做">&#8631;</button>
                            <span style="flex:1;"></span>
                            <span class="tb-sep-strong"></span>
                            <!-- 表格刪除類(粉紅) -- 永遠顯示,非表格時 disabled -->
                            <span class="tb-table-del-zone">
                                <button class="tb-table-del" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('deleteRow', ed.id)" title="表格：刪除目前列">-列</button>
                                <button class="tb-table-del" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('deleteCol', ed.id)" title="表格：刪除目前欄">-欄</button>
                                <button class="tb-table-del" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('deleteTable', ed.id)" title="表格：刪除整張表">-表</button>
                            </span>
                            <span class="tb-sep-strong"></span>
                            <button @click="ceToggleAllEntries(ed.id)"
                                    :title="ceHasCollapsed[ed.id] ? '展開所有 ;; 物件' : '收合所有 ;; 物件'"
                                    x-text="ceHasCollapsed[ed.id] ? '[+]全展' : '[-]全收'"></button>
                        </div>
                        <!-- Pane Toolbar 第二排：連續色筆 / 連續螢光（紅綠黃藍各 4 色） -->
                        <div class="ce-pane-toolbar-2" x-show="!ed.readonly && !ceIsPdfMediaEditor(ed.id)">
                            <span class="tb-group-label">色筆</span>
                            <template x-for="c in colorPenPalette" :key="'pen-'+c.key">
                                <button class="ce-color-btn ce-color-pen"
                                        :class="{ active: ceColorPen[ed.id] === c.hex }"
                                        :style="'color:' + c.hex"
                                        @click="ceToggleColorPen(ed.id, c.hex)"
                                        :title="'色筆 -- ' + c.label + '（有圈選=直接套用；無圈選=切換連續模式）'">A</button>
                            </template>
                            <button class="ce-color-btn ce-color-clear"
                                    :class="{ active: ceColorPen[ed.id] === 'erase' }"
                                    @click="ceToggleColorPen(ed.id, 'erase')"
                                    title="清除字色（有圈選=直接清除；無圈選=切換連續清除模式）">A&times;</button>
                            <span class="tb-sep"></span>
                            <span class="tb-group-label">螢光</span>
                            <template x-for="c in colorHlPalette" :key="'hl-'+c.key">
                                <button class="ce-color-btn ce-color-hl"
                                        :class="{ active: ceColorHl[ed.id] === c.hex }"
                                        :style="'background:' + c.hex"
                                        @click="ceToggleColorHl(ed.id, c.hex)"
                                        :title="'螢光 -- ' + c.label + '（有圈選=直接套用；無圈選=切換連續模式）'">&nbsp;</button>
                            </template>
                            <button class="ce-color-btn ce-color-clear"
                                    :class="{ active: ceColorHl[ed.id] === 'erase' }"
                                    @click="ceToggleColorHl(ed.id, 'erase')"
                                    title="清除底色（有圈選=直接清除；無圈選=切換連續清除模式）">&nbsp;&times;</button>
                            <span class="ce-continuous-hint" x-show="ceColorPen[ed.id] || ceColorHl[ed.id]">連續模式啟用中（ESC 取消）</span>
                            <span style="flex:1;"></span>
                            <span class="tb-sep-strong"></span>
                            <!-- 表格新增類(淺綠) -- 永遠顯示,Tb 永遠 enabled,+列/+欄非表格時 disabled -->
                            <span class="tb-table-add-zone">
                                <button class="tb-table-add"
                                        @click="ceCmd('table', ed.id)" title="插入表格 3x3">Tb</button>
                                <button class="tb-table-add" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('addRowBefore', ed.id)" title="表格：上方插入列">+列&uarr;</button>
                                <button class="tb-table-add" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('addRowAfter', ed.id)" title="表格：下方插入列">+列&darr;</button>
                                <button class="tb-table-add" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('addColBefore', ed.id)" title="表格：左方插入欄">+欄&larr;</button>
                                <button class="tb-table-add" :disabled="!ceTableActive[ed.id]"
                                        @click="ceCmd('addColAfter', ed.id)" title="表格：右方插入欄">+欄&rarr;</button>
                            </span>
                        </div>
                        <!-- 保留條：避免 SelectionToolbar 浮窗覆蓋 toolbar，並提示此區不可編輯 -->
                        <div class="ce-pane-reserved" @mousedown.stop @click.stop></div>
                        <!-- Pane Body (Tiptap mount point) -->
                        <div class="ce-pane-body"></div>
                        <!-- Pane Footer -->
                        <div class="ce-pane-footer">
                            <span class="status-text" x-text="ed.readonly ? '唯讀' : (ed.dirty ? '已修改' : '已儲存')"
                                  :style="ed.readonly ? 'color:#d97706;' : ''"></span>
                            <span style="flex:1;"></span>
                            <button class="btn btn-sm btn-outline-warning" x-show="!ed.readonly"
                                    @click="undoDeletedEntry(ed.id)"
                                    style="margin-right:20px;"
                                    title="還原最近刪除的 Item">誤刪Item</button>
                            <button class="btn btn-sm" x-show="!ed.readonly"
                                    :class="ed.dirty ? 'btn-primary' : 'btn-secondary'"
                                    :disabled="!ed.dirty"
                                    @click="saveEditor(ed.id)">儲存</button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 右側抓重點面板 -->
            <div class="ce-staging" :class="{ open: ceStagingOpen }">
                <div class="ce-staging-header">
                    <span class="ce-staging-header-label">標題</span>
                    <input class="ce-staging-title-input" x-model="stagingTitle"
                           placeholder="空白=自動命名">
                </div>

                <div class="ce-staging-mode-bar">
                    <button class="ce-staging-mode-btn active"
                            @click="stagingMode = stagingMode === 'copy' ? 'move' : 'copy'"
                            x-text="stagingMode === 'copy' ? '複製' : '移動'"
                            :title="stagingMode === 'copy' ? '目前：複製（保留原文），點擊切換為移動' : '目前：移動（刪除原文），點擊切換為複製'"></button>
                    <span class="ce-staging-bar-sep"></span>
                    <button class="ce-staging-mode-btn"
                            @click="clearStaging()"
                            :disabled="stagingItems.length === 0">清空</button>
                    <button class="ce-staging-mode-btn ce-staging-save-btn"
                            :class="{ active: stagingItems.length > 0 }"
                            @click="saveStagingAsAtom()"
                            :disabled="stagingItems.length === 0">存卡片</button>
                </div>

                <div class="ce-staging-hint" x-show="stagingItems.length === 0">
                    在卡片中圈選文字，放開滑鼠後自動加入
                </div>

                <div class="ce-staging-list">
                    <template x-for="(si, idx) in stagingItems" :key="si.id">
                        <div class="ce-staging-item">
                            <div class="ce-staging-item-source">
                                <span x-text="'#' + si.sourceAtomId"></span>
                                <span x-text="si.sourceTitle" class="ce-staging-item-src-title"></span>
                            </div>
                            <div class="ce-staging-item-text" x-text="si.text.length > 200 ? si.text.substring(0, 200) + '...' : si.text"></div>
                            <div class="ce-staging-item-actions">
                                <button title="上移" @click="moveStagingItem(idx, -1)" :disabled="idx === 0">&uarr;</button>
                                <button title="下移" @click="moveStagingItem(idx, 1)" :disabled="idx === stagingItems.length - 1">&darr;</button>
                                <button title="移除" @click="removeStagingItem(si.id)" class="ce-staging-remove">x</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            </div><!-- close flex wrapper -->
        </div>
    </template>

    <!-- 連線編輯（變更類型 + 說明 + 刪除） -->
    <template x-if="showConnTypeModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:560px;">
                <div class="modal-header">
                    <h3>編輯連線</h3>
                    <button class="modal-close" @click="showConnTypeModal=false; connTypeChangeTarget=null;">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <table style="width:100%;font-size:13px;border-collapse:collapse;">
                            <thead>
                                <tr style="border-bottom:1px solid var(--border-light, #dee2e6);text-align:left;">
                                    <th style="padding:4px 6px;width:30px;"></th>
                                    <th style="padding:4px 6px;">類型</th>
                                    <th style="padding:4px 6px;">relation_type</th>
                                    <th style="padding:4px 6px;">語意</th>
                                    <th style="padding:4px 6px;">含義</th>
                                    <th style="padding:4px 6px;text-align:center;">排程</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="rt in relationTypeList" :key="'ct-'+rt.value">
                                    <tr style="border-bottom:1px solid var(--bg-tertiary, #f1f3f5);cursor:pointer;"
                                        :style="selectedRelationType === rt.value ? 'background:var(--accent-bg, #eff6ff);' : ''"
                                        @click="selectedRelationType = rt.value">
                                        <td style="padding:4px 6px;">
                                            <input type="radio" name="connRelType" :value="rt.value"
                                                   x-model="selectedRelationType">
                                        </td>
                                        <td style="padding:4px 6px;white-space:nowrap;">
                                            <span class="relation-color-dot" :style="'background:' + rt.color"></span>
                                            <span x-text="rt.label" style="font-weight:600;"></span>
                                        </td>
                                        <td style="padding:4px 6px;font-size:11px;color:var(--text-muted, #6c757d);font-family:monospace;" x-text="rt.value"></td>
                                        <td style="padding:4px 6px;font-size:12px;color:var(--text-secondary, #495057);" x-text="rt.desc"></td>
                                        <td style="padding:4px 6px;font-size:11px;color:var(--text-muted, #6c757d);" x-text="rt.strength"></td>
                                        <td style="padding:4px 6px;text-align:center;">
                                            <span x-show="rt.sched" style="color:#dc2626;font-weight:700;font-size:12px;">V</span>
                                            <span x-show="!rt.sched" style="color:#adb5bd;font-size:11px;">-</span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="form-group">
                        <label>說明（選填）</label>
                        <input class="form-control" x-model="connTypeChangeLabel" placeholder="關係描述..."
                               @keydown.enter="confirmConnTypeChange()">
                    </div>
                    <div class="form-group">
                        <label>顏色（覆寫 relation_type 預設色）</label>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                            <template x-for="c in connColorPalette" :key="'cc-'+c">
                                <div @click="connTypeChangeColor = c"
                                     :style="'width:24px;height:24px;border-radius:4px;cursor:pointer;background:' + c + ';' + (connTypeChangeColor === c ? 'box-shadow:0 0 0 2px #1f2937;' : 'box-shadow:0 0 0 1px #cbd5e1;')"></div>
                            </template>
                            <button class="btn btn-sm" type="button"
                                    style="margin-left:8px;font-size:11px;"
                                    @click="connTypeChangeColor = ''">使用預設</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-sm"
                            style="border:1px solid var(--danger, #dc2626);color:var(--danger, #dc2626);background:transparent;margin-right:auto;"
                            @click="deleteConnFromModal()">刪除連線</button>
                    <button class="btn btn-secondary" @click="showConnTypeModal=false; connTypeChangeTarget=null;">取消</button>
                    <button class="btn btn-primary" @click="confirmConnTypeChange()">儲存</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 連線標籤 inline 編輯 -->
    <template x-if="editingConnId">
        <div class="conn-edit-overlay"
             @click="saveConnectionLabel()" @keydown.escape.stop="cancelEditConnection()">
            <input class="conn-edit-input"
                   :style="'left:' + editingConnPos.x + 'px; top:' + editingConnPos.y + 'px;'"
                   x-model="editingConnLabel"
                   x-init="$nextTick(() => $el.focus())"
                   @click.stop
                   @keydown.enter="saveConnectionLabel()">
        </div>
    </template>

    <!-- 匯出彈窗 -->
    <template x-if="showExportModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:700px;">
                <div class="modal-header">
                    <h3>匯出畫布</h3>
                    <button class="modal-close" @click="showExportModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div style="display:flex;gap:8px;margin-bottom:12px;">
                        <button class="btn btn-sm" :class="exportFormat==='json' ? 'btn-primary' : 'btn-secondary'"
                                @click="exportCanvas('json')">JSON</button>
                        <button class="btn btn-sm" :class="exportFormat==='md' ? 'btn-primary' : 'btn-secondary'"
                                @click="exportCanvas('md')">Markdown</button>
                    </div>
                    <textarea class="form-control" rows="15" readonly
                              x-model="exportContent" style="font-family:monospace;font-size:12px;"></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="copyExport()">複製</button>
                    <button class="btn btn-primary" @click="downloadExport()">下載</button>
                    <button class="btn btn-secondary" @click="showExportModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 匯入彈窗 -->
    <template x-if="showImportModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>匯入畫布 (JSON)</h3>
                    <button class="modal-close" @click="showImportModal=false">x</button>
                </div>
                <div class="modal-body">
                    <p class="text-sm text-muted" style="margin-bottom:12px;">
                        選擇先前匯出的 JSON 檔案，將卡片放置到當前畫布。已存在的卡片會跳過。
                    </p>
                    <input type="file" accept=".json" @change="importCanvasFromFile($event)"
                           style="font-size:13px;">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showImportModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- UI 設定 -->
    <template x-if="showUISettingsModal">
        <div class="modal-overlay">
            <div class="modal settings-modal">
                <div class="modal-header">
                    <h3>設定</h3>
                    <button class="modal-close" @click="showUISettingsModal=false">x</button>
                </div>
                <div class="modal-body" style="padding:0;">
                    <!-- 分頁 -->
                    <div class="settings-tabs">
                        <button class="settings-tab"
                                :class="{ active: uiSettingsTab === 'canvas' }"
                                @click="uiSettingsTab = 'canvas'">白板</button>
                        <button class="settings-tab"
                                :class="{ active: uiSettingsTab === 'tag-categories' }"
                                @click="uiSettingsTab = 'tag-categories'">標籤分類</button>
                        <button class="settings-tab"
                                :class="{ active: uiSettingsTab === 'entry-schemas' }"
                                @click="uiSettingsTab = 'entry-schemas'">記錄類型</button>
                        <button class="settings-tab"
                                :class="{ active: uiSettingsTab === 'account' }"
                                @click="uiSettingsTab = 'account'">帳號</button>
                    </div>
                    <div class="settings-content">
                        <!-- 白板設定 -->
                        <div x-show="uiSettingsTab === 'canvas'">
                            <div class="form-group">
                                <label style="font-size:12px;font-weight:600;">白板名稱</label>
                                <div class="flex gap-2">
                                    <input class="form-control" x-model="settingsCanvasName"
                                           @keydown.enter="saveCanvasName()" style="flex:1;">
                                    <button class="btn btn-primary" @click="saveCanvasName()">儲存</button>
                                </div>
                            </div>

                            <div class="form-group" style="margin-top:16px;">
                                <label style="font-size:12px;font-weight:600;">白板用途</label>
                                <div style="display:flex;gap:16px;margin-top:6px;">
                                    <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;">
                                        <input type="radio" name="canvasRole"
                                               :checked="canvas && canvas.is_project"
                                               @change="setCanvasIsProject(true)">
                                        <span>專案<span style="color:var(--text-muted);font-size:11px;">（列入專案管理 / Backlog）</span></span>
                                    </label>
                                    <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;">
                                        <input type="radio" name="canvasRole"
                                               :checked="canvas && !canvas.is_project"
                                               @change="setCanvasIsProject(false)">
                                        <span>自由<span style="color:var(--text-muted);font-size:11px;">（思考 / 筆記用途）</span></span>
                                    </label>
                                </div>
                            </div>

                            <!-- 刪除白板 -->
                            <div class="settings-danger-zone">
                                <label style="font-size:12px;font-weight:600;color:var(--danger);">危險操作</label>
                                <div style="margin-top:8px;display:flex;gap:8px;">
                                    <button class="btn btn-sm"
                                            style="border:1px solid var(--border-light);background:var(--bg-tertiary);color:var(--text-secondary);"
                                            @click="archiveCurrentCanvas()">歸檔白板</button>
                                    <button class="btn btn-sm"
                                            style="border:1px solid var(--danger);color:var(--danger);background:transparent;"
                                            @click="deleteCurrentCanvas()">刪除白板</button>
                                </div>
                                <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">
                                    歸檔：隱藏但保留。刪除：永久移除白板（卡片不受影響）。
                                </div>
                            </div>
                        </div>
                        <!-- 標籤分類 -->
                        <div x-show="uiSettingsTab === 'tag-categories'" class="tag-cat-layout">
                            <!-- 左欄：分類（多選） -->
                            <div class="tag-cat-left">
                                <div style="font-size:12px;font-weight:600;margin-bottom:8px;">分類（可多選）</div>
                                <div class="flex gap-2 mb-3">
                                    <input class="form-control" x-model="newCategoryName" placeholder="新分類..."
                                           @keydown.enter="createCategory()" style="flex:1;font-size:12px;">
                                    <button class="btn btn-primary btn-sm" @click="createCategory()">+</button>
                                </div>
                                <template x-for="cat in tagCategories" :key="'uic-'+cat.id">
                                    <div class="tag-cat-item"
                                         :class="{ active: selectedCategoryIds.includes(cat.id) }"
                                         @click="toggleCategorySelection(cat.id)">
                                        <input type="checkbox" :checked="selectedCategoryIds.includes(cat.id)"
                                               @click.stop="toggleCategorySelection(cat.id)"
                                               style="margin:0;">
                                        <span style="flex:1;font-size:12px;" x-text="cat.name"></span>
                                        <span style="font-size:10px;color:var(--text-muted);"
                                              x-text="tags.filter(t => (t.category_ids || []).includes(cat.id)).length"></span>
                                        <button class="btn-ghost" style="padding:0 2px;font-size:10px;color:var(--danger);opacity:0.6;"
                                                @click.stop="if(confirm('刪除分類: '+cat.name+'?')) deleteCategory(cat.id)">x</button>
                                    </div>
                                </template>
                                <div class="tag-cat-item"
                                     :class="{ active: selectedCategoryIds.includes(0) }"
                                     @click="toggleCategorySelection(0)">
                                    <input type="checkbox" :checked="selectedCategoryIds.includes(0)"
                                           @click.stop="toggleCategorySelection(0)"
                                           style="margin:0;">
                                    <span style="flex:1;font-size:12px;color:var(--text-muted);">未分類</span>
                                    <span style="font-size:10px;color:var(--text-muted);"
                                          x-text="tags.filter(t => !t.category_ids || t.category_ids.length === 0).length"></span>
                                </div>
                            </div>
                            <!-- 右欄：標籤 -->
                            <div class="tag-cat-right">
                                <div style="font-size:12px;font-weight:600;margin-bottom:8px;">
                                    <template x-if="selectedCategoryIds.length === 0">
                                        <span>選擇左側分類</span>
                                    </template>
                                    <template x-if="selectedCategoryIds.length > 0">
                                        <span>已選 <span x-text="selectedCategoryIds.length"></span> 個分類 -- 點擊標籤增減歸屬</span>
                                    </template>
                                </div>
                                <template x-if="selectedCategoryIds.length > 0">
                                    <div style="display:flex;flex-wrap:wrap;gap:4px;">
                                        <template x-for="t in tags" :key="'tcr-'+t.id">
                                            <span class="tag-badge tag-cat-tag"
                                                  :style="getTagStyle(t.color)"
                                                  :class="{ 'tag-in-cat': isTagInSelectedCats(t) }"
                                                  @click="toggleTagInCategory(t)"

<!-- ============================================
     Toolbar 按鈕標 tabindex=-1,避免 contenteditable 的 Tab 跑到 toolbar
     觸發如「-表(刪除整張表)」之類的危險按鈕。
     ============================================ -->
<script>
(function () {
    const SEL = '.ce-pane-toolbar button, .ce-pane-toolbar-2 button, .ce-pane-toolbar-pdf button'
    const apply = (root) => {
        if (!root || !root.querySelectorAll) return
        root.querySelectorAll(SEL).forEach(b => {
            if (b.tabIndex !== -1) b.tabIndex = -1
        })
    }
    const start = () => {
        apply(document)
        const obs = new MutationObserver(muts => {
            for (const m of muts) {
                m.addedNodes.forEach(n => { if (n.nodeType === 1) apply(n) })
            }
        })
        obs.observe(document.body, { childList: true, subtree: true })
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start)
    } else {
        start()
    }
})()
</script>
