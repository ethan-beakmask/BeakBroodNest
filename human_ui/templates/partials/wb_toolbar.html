            <!-- 工具列 -->
            <div class="wb-toolbar">
                <button x-show="selectedAtomIds.length >= 2" @click="createGroupFromSelection()">群組</button>
                <div class="separator" x-show="selectedAtomIds.length >= 2"></div>
                <button @click="openExchangeModal()" title="交換卡片：寄存到交換包，或從交換包取出">交換</button>
                <button @click="openTrashModal()" title="字紙簍">字紙簍</button>
                <div class="separator"></div>
                <button :class="{ active: mode === 'connect' }" @click="toggleConnectMode()">連線</button>
                <div class="separator"></div>
                <button x-show="selectedAtomIds.length >= 1 || selectedAtomId"
                        style="color:var(--danger);"
                        @click="deleteSelected()">刪除</button>
                <div class="separator" x-show="selectedAtomIds.length >= 1 || selectedAtomId"></div>
                <button @click="fitView()">適應</button>
                <div class="separator"></div>
                <button :class="{ active: filterPanelOpen }" @click="filterPanelOpen = !filterPanelOpen"
                        :style="hasActiveFilters ? 'color:var(--accent);font-weight:600;' : ''">
                    篩選<span x-show="hasActiveFilters" x-text="' (' + hiddenAtomCount + ')'"></span>
                </button>
                <div class="separator"></div>
                <button @click="doUndo()" :disabled="undoStack.length === 0"
                        :style="undoStack.length === 0 ? 'opacity:0.4;' : ''" title="復原 (Ctrl+Z)">&#8630;</button>
                <button @click="doRedo()" :disabled="redoStack.length === 0"
                        :style="redoStack.length === 0 ? 'opacity:0.4;' : ''" title="重做 (Ctrl+Shift+Z)">&#8631;</button>
                <div class="separator"></div>
                <button @click="cycleCardSizeMode()" :title="'卡片高度：' + cardSizeModeLabels[cardSizeMode]"
                        x-text="cardSizeModeLabels[cardSizeMode]"
                        style="min-width:36px;"></button>
                <button :class="{ active: showThumbnailTitle }"
                        @click="toggleShowThumbnailTitle()"
                        :title="showThumbnailTitle ? '隱藏縮圖卡標題（hover 顯示）' : '顯示縮圖卡標題'">標題</button>
                <div class="separator"></div>
                <button @click="exportCanvas('json')" title="匯出 JSON">&#8615;</button>
                <button @click="showImportModal=true" title="匯入">&#8613;</button>
            </div>

            <!-- 篩選面板 -->
            <div class="wb-filter-panel" x-show="filterPanelOpen" x-transition
                 @mousedown.stop @click.stop>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="font-weight:600;font-size:12px;">篩選</span>
                    <button class="btn-ghost btn-sm" @click="resetFilters()" style="font-size:11px;">重置</button>
                </div>
                <div style="margin-bottom:6px;">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">類型</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;">
                        <template x-for="(cfg, key) in atomTypeConfig" :key="key">
                            <button class="wb-filter-chip"
                                    :class="{ active: filterTypes[key] }"
                                    :style="filterTypes[key] ? 'background:' + cfg.bg + ';color:' + cfg.color + ';border-color:' + cfg.border : ''"
                                    @click="toggleFilterType(key)"
                                    x-text="key"></button>
                        </template>
                    </div>
                </div>
                <div style="margin-bottom:6px;">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">生命週期</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;">
                        <template x-for="lc in ['active','aging','archived','terminal']" :key="lc">
                            <button class="wb-filter-chip"
                                    :class="{ active: filterLifecycles[lc] }"
                                    @click="toggleFilterLifecycle(lc)"
                                    x-text="lc"></button>
                        </template>
                    </div>
                </div>
                <div x-show="tags.length > 0">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">標籤 (OR)</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;">
                        <template x-for="t in tags" :key="'ft-'+t.id">
                            <button class="wb-filter-chip"
                                    :class="{ active: filterTagIds.includes(t.id) }"
                                    :style="filterTagIds.includes(t.id) ? getTagStyle(t.color) : ''"
                                    @click="toggleFilterTag(t.id)"
                                    x-text="t.name"></button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 批次操作列 -->
            <div class="wb-batch-bar" x-show="selectedAtomIds.length >= 2" x-transition
                 :style="'left:' + batchBarX + 'px; top:' + batchBarY + 'px;'"
                 @mousedown.stop @click.stop>
                <span style="font-size:12px;margin-right:8px;"
                      x-text="selectedAtomIds.length + ' 個已選'"></span>
                <select class="wb-batch-select" @change="if($event.target.value){batchUpdateType($event.target.value);$event.target.value=''}">
                    <option value="">改類型...</option>
                    <option value="A">A - 萬用</option>
                    <option value="B">B - 發散</option>
                    <option value="C">C - 流程</option>
                    <option value="D">D - 歸納</option>
                    <option value="E">E - 套表</option>
                    <option value="F">F - 碎片</option>
                </select>
                <select class="wb-batch-select" @change="if($event.target.value){batchUpdateLifecycle($event.target.value);$event.target.value=''}">
                    <option value="">知識生命週期...</option>
                    <option value="active">active 活躍中</option>
                    <option value="aging">aging 老化中</option>
                    <option value="archived">archived 已歸檔</option>
                    <option value="terminal">terminal 終結</option>
                </select>
                <button class="wb-batch-select" @click="batchTagActiveTab=0; showBatchTagModal=true">標籤...</button>
                <button class="wb-batch-select" @click="createGroupFromSelection()">群組</button>
                <button class="wb-batch-select" @click="openSelectedInEditor()">編輯</button>
                <button class="wb-batch-select" @click="openExchangeModal()" title="寄存到交換包">交換</button>
                <div style="flex:1;"></div>
                <button class="btn-ghost btn-sm" style="color:var(--danger);" @click="deleteSelected()">移除</button>
            </div>

            <!-- 縮放控制 -->
            <div class="wb-zoom">
                <button @click="toggleMinimap()" title="Minimap" style="font-size:11px;">M</button>
                <div class="separator" style="width:1px; height:14px; background:var(--border-light); margin:0 2px;"></div>
                <button @click="zoomOut()">-</button>
                <span x-text="zoomPercent + '%'" style="min-width:36px; text-align:center;"></span>
                <button @click="zoomIn()">+</button>
                <button @click="resetZoom()" style="margin-left:4px; font-size:11px;">重置</button>
            </div>

            <!-- Render Test Panel -->
            <div class="rt-panel" :class="{ 'rt-collapsed': !rtPanelOpen }"
                 @mousedown.stop @mousemove.stop @mouseup.stop @wheel.stop>
                <div class="rt-panel-toggle" @click="rtPanelOpen = !rtPanelOpen"
                     x-text="rtPanelOpen ? 'Render Test ^' : 'RT'"></div>
                <div class="rt-panel-body" x-show="rtPanelOpen" x-transition>
                    <div class="rt-row">
                        <span class="rt-label">Engine</span>
                        <button class="rt-btn" :class="{ active: rtEngine === 'individual' }"
                                @click="rtEngine = 'individual'; applyRenderSettings()">Individual</button>
                        <button class="rt-btn" :class="{ active: rtEngine === 'grouped' }"
                                @click="rtEngine = 'grouped'; applyRenderSettings()">Grouped</button>
                    </div>
                    <div class="rt-row">
                        <span class="rt-label">Line</span>
                        <button class="rt-btn" :class="{ active: rtLineStyle === 'curve' }"
                                @click="rtLineStyle = 'curve'; applyRenderSettings()">Curve</button>
                        <button class="rt-btn" :class="{ active: rtLineStyle === 'straight' }"
                                @click="rtLineStyle = 'straight'; applyRenderSettings()">Straight</button>
                        <button class="rt-btn" :class="{ active: rtLineStyle === 'none' }"
                                @click="rtLineStyle = 'none'; applyRenderSettings()">None</button>
                    </div>
                    <div class="rt-row">
                        <label class="rt-label">
                            <input type="checkbox" x-model="rtOptEnabled"
                                   @change="applyRenderSettings()"> 8-way
                        </label>
                        <span class="rt-sub">per sector</span>
                        <input type="number" class="rt-num" min="0" max="999"
                               x-model.number="rtOptPerSector"
                               @change="applyRenderSettings()">
                    </div>
                    <div class="rt-row rt-stats">
                        <span x-text="'Node: ' + atoms.length"></span>
                        <span x-text="'Edge: ' + renderStats.rendered + ' / ' + renderStats.total"></span>
                    </div>
                </div>
            </div>
