        <!-- 左側邊欄 -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="flex items-center justify-between mb-2">
                    <div class="sidebar-title">白板</div>
                    <button class="btn-ghost btn-sm" @click="showNewCanvasModal=true">+</button>
                </div>

                <!-- 最近 7 個 -->
                <template x-for="c in recentCanvases" :key="'rc-'+c.slug">
                    <a :href="'/beakbroodnest/canvas/' + c.slug"
                       class="sidebar-item"
                       :class="{ active: c.slug == canvasId }">
                        <span class="icon icon-wb">W</span>
                        <span x-text="c.name" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
                        <button class="btn-ghost" style="padding:2px 4px; font-size:11px; opacity:0.5;"
                                @click.prevent.stop="if(confirm('刪除此白板?')) deleteCanvas(c.slug)"
                                x-show="canvases.length > 1">x</button>
                    </a>
                </template>

                <!-- 其他白板：下拉清單（含標籤篩選） -->
                <div class="sidebar-canvas-dropdown" style="position:relative;margin-top:4px;"
                     @click.outside="canvasDropdownOpen = false">
                    <button class="btn-ghost"
                            style="width:100%;text-align:left;font-size:12px;padding:4px 6px;border:1px solid var(--border-light);border-radius:4px;display:flex;align-items:center;gap:6px;"
                            @click="canvasDropdownOpen = !canvasDropdownOpen">
                        <span style="flex:1;color:var(--text-muted);">
                            其他白板
                            <span x-show="canvasTagFilter.length > 0"
                                  style="color:var(--accent);"
                                  x-text="'(過濾 '+canvasTagFilter.length+')'"></span>
                        </span>
                        <span style="font-size:10px;" x-text="canvasDropdownOpen ? 'v' : '>'"></span>
                    </button>
                    <div x-show="canvasDropdownOpen" x-cloak
                         style="position:absolute;left:0;right:0;top:100%;z-index:50;margin-top:2px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.15);max-height:60vh;overflow-y:auto;">
                        <!-- 篩選區 -->
                        <div style="padding:6px 8px;border-bottom:1px solid var(--border-light);background:var(--bg-tertiary);">
                            <div style="font-size:11px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;">
                                <span>篩選（多選＝OR）</span>
                                <button class="btn-ghost" style="font-size:10px;padding:0 4px;"
                                        x-show="canvasTagFilter.length > 0"
                                        @click="clearCanvasTagFilter()">清除</button>
                            </div>
                            <div style="display:flex;flex-wrap:wrap;gap:3px;">
                                <template x-for="t in humanTags" :key="'cf-'+t.id">
                                    <span class="tag-badge"
                                          :style="getTagStyle(t.color) + ';cursor:pointer;font-size:10px;padding:1px 6px;' + (canvasTagFilter.includes(t.id) ? '' : 'opacity:0.4;')"
                                          @click="toggleCanvasTagFilter(t.id)"
                                          x-text="t.name"></span>
                                </template>
                                <span x-show="humanTags.length === 0" style="font-size:10px;color:var(--text-muted);">尚無人類標籤，請至 設定→標籤分類 建立</span>
                            </div>
                        </div>
                        <!-- 清單 -->
                        <template x-for="c in filteredOtherCanvases" :key="'oc-'+c.slug">
                            <a :href="'/beakbroodnest/canvas/' + c.slug"
                               class="sidebar-item"
                               style="border-radius:0;"
                               :class="{ active: c.slug == canvasId }">
                                <span class="icon icon-wb">W</span>
                                <span x-text="c.name" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
                            </a>
                        </template>
                        <div x-show="filteredOtherCanvases.length === 0"
                             style="padding:8px;text-align:center;font-size:11px;color:var(--text-muted);">
                            <span x-show="canvasTagFilter.length > 0">無符合過濾的白板</span>
                            <span x-show="canvasTagFilter.length === 0">沒有其他白板</span>
                        </div>
                    </div>
                </div>

                <!-- 歸檔白板開關 -->
                <div class="sidebar-archived-toggle" x-show="archivedCanvasCount > 0" style="margin-top:6px;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; color:var(--text-muted);">
                        <input type="checkbox" x-model="showArchivedCanvases" @change="loadCanvases()">
                        <span>已歸檔 (<span x-text="archivedCanvasCount"></span>)</span>
                    </label>
                </div>
            </div>

            <div class="sidebar-section sidebar-cards-section">
                <div class="flex items-center justify-between mb-2">
                    <div class="sidebar-title">卡片</div>
                    <span class="text-sm text-muted" x-text="atoms.length"></span>
                </div>
                <div class="sidebar-card-list">
                    <template x-for="ca in sidebarAtoms" :key="'sc-'+ca.atom_id">
                        <div class="sidebar-card-item"
                             :class="{ active: selectedAtomId === ca.atom_id }"
                             @click="openCardEditor(ca.atom_id)"
                             :title="ca.atom ? ca.atom.title : ''">
                            <span class="sidebar-card-type"
                                  :style="'color:' + (atomTypeConfig[ca.atom && ca.atom.atom_type] ? atomTypeConfig[ca.atom.atom_type].color : 'var(--text-muted)')"
                                  x-text="ca.atom ? ca.atom.atom_type : '?'"></span>
                            <span class="sidebar-card-id" x-text="'#' + ca.atom_id"></span>
                            <span class="sidebar-card-title" x-text="ca.atom ? ca.atom.title : '(無標題)'"></span>
                        </div>
                    </template>
                    <div x-show="atoms.length === 0" class="text-sm text-muted" style="padding:4px 8px;">白板上沒有卡片</div>
                </div>
            </div>

            <!-- Minimap + 縮放控制（置底固定） -->
            <div class="sidebar-section sidebar-minimap-section">
                <div class="wb-minimap" x-show="_minimapVisible"
                     @mousedown.stop.prevent="onMinimapMouseDown($event)"
                     @mousemove.stop="onMinimapMouseMove($event)"
                     @mouseup.stop="onMinimapMouseUp($event)"
                     @mouseleave="onMinimapMouseUp($event)">
                    <canvas x-ref="minimapCanvas" width="216" height="140"></canvas>
                </div>
                <div class="wb-zoom">
                    <button @click="toggleMinimap()" title="Minimap" style="font-size:11px;">M</button>
                    <div class="separator" style="width:1px; height:14px; background:var(--border-light); margin:0 2px;"></div>
                    <button @click="zoomOut()">-</button>
                    <span x-text="zoomPercent + '%'" style="min-width:36px; text-align:center;"></span>
                    <button @click="zoomIn()">+</button>
                    <button @click="resetZoom()" style="margin-left:4px; font-size:11px;">重置</button>
                </div>
            </div>
        </div>
