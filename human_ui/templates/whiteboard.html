{% extends "base.html" %}
{% block title %}白板 - BeakCortex{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/whiteboard.css?v={{ cache_ver }}">
<link rel="stylesheet" href="/static/css/card-editor.css?v={{ cache_ver }}">
{% endblock %}
{% block extra_js %}
<script src="/static/js/card-editor.bundle.js?v={{ cache_ver }}"></script>
<script src="/static/js/whiteboard.js?v={{ cache_ver }}"></script>
{% endblock %}

{% block body %}
<div x-data="whiteboardApp({{ canvas_id }})" x-init="init()"
     @click="closeContextMenu()"
     @keydown.escape.window="if(cardEditorOpen){ closeCardEditor(); return; } cancelConnDrag(); cancelInlineEdit(); deselectCard(); closeContextMenu(); showNewAtomModal=false; showAddExistingModal=false; showNewCanvasModal=false; showTagModal=false; showRelationModal=false; showGroupModal=false">

    <!-- Toast -->
    <div class="toast-container">
        <template x-for="(t, i) in toasts" :key="t.id">
            <div class="toast" :class="'toast-' + t.type" x-text="t.msg"
                 x-init="setTimeout(() => removeToast(t.id), t.duration || 4000)"></div>
        </template>
    </div>

    <!-- Header -->
    <div class="app-header">
        <div class="logo">BeakCortex</div>
        <div class="header-right">
            <template x-if="rtLineStyle !== 'curve' || rtOptEnabled || rtEngine !== 'individual'">
                <span class="render-mode-badge"
                      x-text="(rtEngine === 'grouped' ? 'GRP ' : '') + (rtOptEnabled ? '8way/' + rtOptPerSector + ' ' : '') + (rtLineStyle === 'straight' ? 'STRAIGHT' : rtLineStyle === 'none' ? 'NO-EDGE' : 'CURVE')"></span>
            </template>
            <a href="/help" target="_blank" class="btn-ghost btn-sm" title="Help" style="font-size:12px;">?</a>
            <span class="text-sm text-muted" x-text="canvas ? canvas.name : ''"></span>
        </div>
    </div>

    <div class="app-layout">

        <!-- 左側邊欄 -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="flex items-center justify-between mb-2">
                    <div class="sidebar-title">白板</div>
                    <button class="btn-ghost btn-sm" @click="showNewCanvasModal=true">+</button>
                </div>
                <template x-for="c in canvases" :key="c.id">
                    <a :href="'/canvas/' + c.id"
                       class="sidebar-item"
                       :class="{ active: c.id == canvasId }">
                        <span class="icon icon-wb">W</span>
                        <span x-text="c.name" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
                        <button class="btn-ghost" style="padding:2px 4px; font-size:11px; opacity:0.5;"
                                @click.prevent.stop="if(confirm('刪除此白板?')) deleteCanvas(c.id)"
                                x-show="canvases.length > 1">x</button>
                    </a>
                </template>
            </div>

            <div class="sidebar-section">
                <div class="flex items-center justify-between mb-2">
                    <div class="sidebar-title">標籤</div>
                    <button class="btn-ghost btn-sm" @click="showTagModal=true">+</button>
                </div>
                <template x-for="t in tags" :key="t.id">
                    <div class="sidebar-item">
                        <span class="tag-badge" :style="getTagStyle(t.color)" x-text="t.name"></span>
                    </div>
                </template>
                <div x-show="tags.length === 0" class="text-sm text-muted" style="padding:4px 8px;">尚無標籤</div>
            </div>
        </div>

        <!-- 白板主區域 -->
        <div class="wb-viewport"
             x-ref="viewport"
             :class="{ 'connect-mode': mode === 'connect', 'conn-dragging': isConnDragging, 'panning': isPanning, 'box-selecting': isBoxSelecting }"
             @mousedown="onViewportMouseDown($event)"
             @mousemove="onViewportMouseMove($event)"
             @mouseup="onViewportMouseUp($event)"
             @contextmenu.prevent>

            <!-- 工具列 -->
            <div class="wb-toolbar">
                <button @click="openNewAtomModal()">+ 原子</button>
                <button @click="openAddExistingModal()">+ 現有</button>
                <div class="separator"></div>
                <button :class="{ active: mode === 'connect' }" @click="toggleConnectMode()">連線</button>
                <div class="separator"></div>
                <button x-show="selectedAtomIds.length >= 2" @click="createGroupFromSelection()">群組</button>
                <div class="separator" x-show="selectedAtomIds.length >= 2"></div>
                <button @click="fitView()">適應</button>
                <div class="separator"></div>
                <button :class="{ active: filterPanelOpen }" @click="filterPanelOpen = !filterPanelOpen"
                        :style="hasActiveFilters ? 'color:var(--accent);font-weight:600;' : ''">
                    篩選<span x-show="hasActiveFilters" x-text="' (' + hiddenAtomCount + ')'"></span>
                </button>
                <div class="separator"></div>
                <button @click="doUndo()" :disabled="undoStack.length === 0"
                        :style="undoStack.length === 0 ? 'opacity:0.4;' : ''" title="復原 (Ctrl+Z)">&#8630;</button>
                <button @click="doRedo()" :disabled="redoStack.length === 0"
                        :style="redoStack.length === 0 ? 'opacity:0.4;' : ''" title="重做 (Ctrl+Shift+Z)">&#8631;</button>
                <div class="separator"></div>
                <button @click="exportCanvas('json')" title="匯出 JSON">&#8615;</button>
                <button @click="showImportModal=true" title="匯入">&#8613;</button>
            </div>

            <!-- 篩選面板 -->
            <div class="wb-filter-panel" x-show="filterPanelOpen" x-transition
                 @mousedown.stop @click.stop>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="font-weight:600;font-size:12px;">篩選</span>
                    <button class="btn-ghost btn-sm" @click="resetFilters()" style="font-size:11px;">重置</button>
                </div>
                <div style="margin-bottom:6px;">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">類型</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;">
                        <template x-for="(cfg, key) in atomTypeConfig" :key="key">
                            <button class="wb-filter-chip"
                                    :class="{ active: filterTypes[key] }"
                                    :style="filterTypes[key] ? 'background:' + cfg.bg + ';color:' + cfg.color + ';border-color:' + cfg.border : ''"
                                    @click="toggleFilterType(key)"
                                    x-text="key"></button>
                        </template>
                    </div>
                </div>
                <div style="margin-bottom:6px;">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">生命週期</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;">
                        <template x-for="lc in ['active','aging','archived','terminal']" :key="lc">
                            <button class="wb-filter-chip"
                                    :class="{ active: filterLifecycles[lc] }"
                                    @click="toggleFilterLifecycle(lc)"
                                    x-text="lc"></button>
                        </template>
                    </div>
                </div>
                <div x-show="tags.length > 0">
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">標籤 (OR)</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;">
                        <template x-for="t in tags" :key="'ft-'+t.id">
                            <button class="wb-filter-chip"
                                    :class="{ active: filterTagIds.includes(t.id) }"
                                    :style="filterTagIds.includes(t.id) ? getTagStyle(t.color) : ''"
                                    @click="toggleFilterTag(t.id)"
                                    x-text="t.name"></button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 批次操作列 -->
            <div class="wb-batch-bar" x-show="selectedAtomIds.length >= 2" x-transition
                 @mousedown.stop @click.stop>
                <span style="font-size:12px;margin-right:8px;"
                      x-text="selectedAtomIds.length + ' 個已選'"></span>
                <select class="wb-batch-select" @change="if($event.target.value){batchUpdateType($event.target.value);$event.target.value=''}">
                    <option value="">改類型...</option>
                    <option value="A">A - 萬用</option>
                    <option value="B">B - 發散</option>
                    <option value="C">C - 流程</option>
                    <option value="D">D - 歸納</option>
                    <option value="E">E - 套表</option>
                    <option value="F">F - 碎片</option>
                </select>
                <select class="wb-batch-select" @change="if($event.target.value){batchUpdateLifecycle($event.target.value);$event.target.value=''}">
                    <option value="">改週期...</option>
                    <option value="active">active</option>
                    <option value="aging">aging</option>
                    <option value="archived">archived</option>
                    <option value="terminal">terminal</option>
                </select>
                <template x-for="t in tags" :key="'bt-'+t.id">
                    <button class="wb-filter-chip" style="font-size:11px;"
                            :style="getTagStyle(t.color)"
                            @click="batchToggleTag(t.id)"
                            x-text="t.name"></button>
                </template>
                <div style="flex:1;"></div>
                <button class="btn-ghost btn-sm" style="color:var(--danger);" @click="deleteSelected()">移除</button>
            </div>

            <!-- 畫布 -->
            <div class="wb-canvas" x-ref="canvas" @contextmenu.prevent>
                <svg class="wb-connections" x-ref="connSvg"></svg>
                <!-- 連線預覽 -->
                <svg class="wb-connections wb-preview-layer" x-ref="previewSvg">
                    <defs>
                        <marker id="preview-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
                        </marker>
                    </defs>
                    <path x-ref="previewLine" d="" fill="none"
                          stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4"
                          marker-end="url(#preview-arrow)" style="display:none;"/>
                </svg>

                <!-- 群組容器 -->
                <template x-for="g in groups" :key="'g-' + g.id">
                    <div class="wb-group"
                         :id="'group-' + g.id"
                         :style="getGroupStyle(g)"
                         @mousedown.stop="onGroupMouseDown($event, g)"
                         @contextmenu.prevent.stop>
                        <div class="wb-group-label"
                             :style="getGroupLabelStyle(g)"
                             @dblclick.stop="openGroupEditModal(g)"
                             x-text="g.name"></div>
                        <div class="wb-group-resize" @mousedown.stop.prevent="onGroupResizeMouseDown($event, g)"></div>
                    </div>
                </template>

                <!-- 原子卡片 -->
                <template x-for="ca in atoms" :key="ca.id">
                    <div class="wb-card"
                         x-show="isAtomVisible(ca)"
                         :id="'card-' + ca.atom_id"
                         :class="{
                             selected: selectedAtomId === ca.atom_id,
                             'multi-selected': selectedAtomIds.includes(ca.atom_id),
                             dragging: dragCard && dragCard.atom_id === ca.atom_id,
                             'conn-source': mode === 'connect' && connSourceAtomId === ca.atom_id,
                             'conn-drop-target': isConnDragging && connDragHoverAtomId === ca.atom_id,
                             highlighted: highlightedAtomIds.includes(ca.atom_id),
                         }"
                         :style="getCardStyle(ca)"
                         @click.stop="mode === 'connect' ? onCardClickForConnect($event, ca) : onCardClick(ca)"
                         @contextmenu.prevent.stop
                         @mouseenter="onCardMouseEnterForConn(ca)"
                         @mouseleave="onCardMouseLeaveForConn(ca)">

                        <div class="wb-card-blocked" x-show="ca.is_blocked">BLOCKED</div>

                        <div class="wb-card-anchor top" @mousedown.stop.prevent="startConnDrag($event, ca, 'top')"></div>
                        <div class="wb-card-anchor bottom" @mousedown.stop.prevent="startConnDrag($event, ca, 'bottom')"></div>
                        <div class="wb-card-anchor left" @mousedown.stop.prevent="startConnDrag($event, ca, 'left')"></div>
                        <div class="wb-card-anchor right" @mousedown.stop.prevent="startConnDrag($event, ca, 'right')"></div>

                        <div class="wb-card-header" @mousedown.stop="onCardMouseDown($event, ca)">
                            <span class="wb-card-type"
                                  :style="getTypeBadgeStyle(ca.atom ? ca.atom.atom_type : 'F')"
                                  x-text="atomTypeConfig[ca.atom ? ca.atom.atom_type : 'F'] ? atomTypeConfig[ca.atom ? ca.atom.atom_type : 'F'].label : '?'"></span>
                            <span class="wb-card-title" x-text="ca.atom ? ca.atom.title : '(無標題)'"></span>
                        </div>

                        <div class="wb-card-body"
                             @mousedown.stop="editingAtomId !== ca.atom_id && onCardBodyMouseDown($event, ca)">
                            <div class="wb-card-content wb-markdown"
                                 x-show="editingAtomId !== ca.atom_id"
                                 x-html="renderMarkdown(ca.atom ? ca.atom.content : '', 800)"></div>
                            <template x-if="editingAtomId === ca.atom_id">
                                <textarea :id="'edit-' + ca.atom_id"
                                          class="wb-card-edit"
                                          x-model="editContent"
                                          x-init="$nextTick(() => $el.focus())"
                                          @blur="finishInlineEdit(ca)"
                                          @keydown.escape.stop.prevent="cancelInlineEdit()"
                                          @mousedown.stop
                                          @click.stop></textarea>
                            </template>
                        </div>

                        <div class="wb-card-footer" x-show="ca.atom && ca.atom.tags && ca.atom.tags.length > 0">
                            <template x-for="t in (ca.atom && ca.atom.tags ? ca.atom.tags : [])" :key="t.id">
                                <span class="tag-badge tag-sm" :style="getTagStyle(t.color)" x-text="t.name"></span>
                            </template>
                        </div>

                        <div class="wb-card-resize" @mousedown.stop.prevent="onResizeMouseDown($event, ca)"></div>
                    </div>
                </template>
            </div>

            <!-- 框選矩形 -->
            <div class="wb-box-select" :style="boxSelectStyle"></div>

            <!-- Minimap -->
            <div class="wb-minimap" x-show="_minimapVisible"
                 @mousedown.stop.prevent="onMinimapMouseDown($event)"
                 @mousemove.stop="onMinimapMouseMove($event)"
                 @mouseup.stop="onMinimapMouseUp($event)"
                 @mouseleave="onMinimapMouseUp($event)">
                <canvas x-ref="minimapCanvas" width="200" height="140"></canvas>
            </div>

            <!-- 縮放控制 -->
            <div class="wb-zoom">
                <button @click="toggleMinimap()" title="Minimap" style="font-size:11px;">M</button>
                <div class="separator" style="width:1px; height:14px; background:var(--border-light); margin:0 2px;"></div>
                <button @click="zoomOut()">-</button>
                <span x-text="zoomPercent + '%'" style="min-width:36px; text-align:center;"></span>
                <button @click="zoomIn()">+</button>
                <button @click="resetZoom()" style="margin-left:4px; font-size:11px;">重置</button>
            </div>

            <!-- Render Test Panel -->
            <div class="rt-panel" :class="{ 'rt-collapsed': !rtPanelOpen }"
                 @mousedown.stop @mousemove.stop @mouseup.stop @wheel.stop>
                <div class="rt-panel-toggle" @click="rtPanelOpen = !rtPanelOpen"
                     x-text="rtPanelOpen ? 'Render Test ^' : 'RT'"></div>
                <div class="rt-panel-body" x-show="rtPanelOpen" x-transition>
                    <div class="rt-row">
                        <span class="rt-label">Engine</span>
                        <button class="rt-btn" :class="{ active: rtEngine === 'individual' }"
                                @click="rtEngine = 'individual'; applyRenderSettings()">Individual</button>
                        <button class="rt-btn" :class="{ active: rtEngine === 'grouped' }"
                                @click="rtEngine = 'grouped'; applyRenderSettings()">Grouped</button>
                    </div>
                    <div class="rt-row">
                        <span class="rt-label">Line</span>
                        <button class="rt-btn" :class="{ active: rtLineStyle === 'curve' }"
                                @click="rtLineStyle = 'curve'; applyRenderSettings()">Curve</button>
                        <button class="rt-btn" :class="{ active: rtLineStyle === 'straight' }"
                                @click="rtLineStyle = 'straight'; applyRenderSettings()">Straight</button>
                        <button class="rt-btn" :class="{ active: rtLineStyle === 'none' }"
                                @click="rtLineStyle = 'none'; applyRenderSettings()">None</button>
                    </div>
                    <div class="rt-row">
                        <label class="rt-label">
                            <input type="checkbox" x-model="rtOptEnabled"
                                   @change="applyRenderSettings()"> 8-way
                        </label>
                        <span class="rt-sub">per sector</span>
                        <input type="number" class="rt-num" min="0" max="999"
                               x-model.number="rtOptPerSector"
                               @change="applyRenderSettings()">
                    </div>
                    <div class="rt-row rt-stats">
                        <span x-text="'Node: ' + atoms.length"></span>
                        <span x-text="'Edge: ' + renderStats.rendered + ' / ' + renderStats.total"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側面板 -->
        <div class="wb-panel" :class="{ hidden: !showPanel || !selectedAtom }">
            <template x-if="selectedAtom">
                <div>
                    <div class="wb-panel-header">
                        <h3 x-text="selectedAtom.atom ? selectedAtom.atom.title : '(無標題)'"></h3>
                        <button class="btn btn-sm btn-primary" style="margin-right:8px; font-size:11px; padding:2px 10px;"
                                @click="openCardEditor(selectedAtom.atom_id)">開啟卡片</button>
                        <button class="modal-close" @click="deselectCard()">x</button>
                    </div>
                    <div class="wb-panel-body">
                        <div class="wb-panel-section">
                            <div class="wb-panel-section-title">原子資訊</div>
                            <div class="form-group">
                                <label>標題</label>
                                <input class="form-control"
                                       :value="selectedAtom.atom ? selectedAtom.atom.title : ''"
                                       @change="updateAtomField(selectedAtom, 'title', $event.target.value)">
                            </div>
                            <div class="form-group">
                                <label>內容</label>
                                <textarea class="form-control" rows="5"
                                          :value="selectedAtom.atom ? selectedAtom.atom.content : ''"
                                          @change="updateAtomField(selectedAtom, 'content', $event.target.value)"></textarea>
                            </div>
                            <div class="form-group">
                                <label>類型</label>
                                <select class="form-control"
                                        :value="selectedAtom.atom ? selectedAtom.atom.atom_type : 'F'"
                                        @change="updateAtomField(selectedAtom, 'atom_type', $event.target.value)">
                                    <option value="A">A - 萬用</option>
                                    <option value="B">B - 發散</option>
                                    <option value="C">C - 流程</option>
                                    <option value="D">D - 歸納</option>
                                    <option value="E">E - 套表</option>
                                    <option value="F">F - 碎片</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>生命週期</label>
                                <select class="form-control"
                                        :value="selectedAtom.atom ? selectedAtom.atom.lifecycle : 'active'"
                                        @change="updateAtomField(selectedAtom, 'lifecycle', $event.target.value)">
                                    <option value="active">active (活躍)</option>
                                    <option value="aging">aging (老化)</option>
                                    <option value="archived">archived (歸檔)</option>
                                    <option value="terminal">terminal (終止)</option>
                                </select>
                            </div>
                        </div>

                        <div class="wb-panel-section">
                            <div class="wb-panel-section-title">標籤</div>
                            <div style="display:flex; flex-wrap:wrap; gap:4px;">
                                <template x-for="t in tags" :key="t.id">
                                    <span class="tag-badge"
                                          :style="getTagStyle(t.color) + 'cursor:pointer;'"
                                          :class="{ selected: atomHasTag(selectedAtom, t.id) }"
                                          @click="toggleAtomTag(selectedAtom, t.id)">
                                        <span x-show="atomHasTag(selectedAtom, t.id)">v </span>
                                        <span x-text="t.name"></span>
                                    </span>
                                </template>
                            </div>
                        </div>

                        <!-- 因果關係 -->
                        <div class="wb-panel-section" x-show="selectedAtomDetails">
                            <div class="wb-panel-section-title">因果關係</div>

                            <!-- 出 -->
                            <template x-if="selectedAtomDetails && selectedAtomDetails.relations_from && selectedAtomDetails.relations_from.length > 0">
                                <div class="relation-list">
                                    <div class="relation-list-title">出 --></div>
                                    <template x-for="r in selectedAtomDetails.relations_from" :key="r.id">
                                        <div class="relation-item"
                                             :class="{ 'off-canvas': !isAtomOnCanvas(r.to_atom_id) }"
                                             @click="isAtomOnCanvas(r.to_atom_id) && navigateToAtom(r.to_atom_id)">
                                            <span class="relation-type-badge" x-text="relationLabelMap[r.relation_type] || r.relation_type"></span>
                                            <span class="relation-target" x-text="r.to_atom ? r.to_atom.title : '#' + r.to_atom_id"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- 入 -->
                            <template x-if="selectedAtomDetails && selectedAtomDetails.relations_to && selectedAtomDetails.relations_to.length > 0">
                                <div class="relation-list mt-2">
                                    <div class="relation-list-title">入 <--</div>
                                    <template x-for="r in selectedAtomDetails.relations_to" :key="r.id">
                                        <div class="relation-item"
                                             :class="{ 'off-canvas': !isAtomOnCanvas(r.from_atom_id) }"
                                             @click="isAtomOnCanvas(r.from_atom_id) && navigateToAtom(r.from_atom_id)">
                                            <span class="relation-type-badge" x-text="relationLabelMap[r.relation_type] || r.relation_type"></span>
                                            <span class="relation-target" x-text="r.from_atom ? r.from_atom.title : '#' + r.from_atom_id"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <div x-show="selectedAtomDetails && (!selectedAtomDetails.relations_from || selectedAtomDetails.relations_from.length === 0) && (!selectedAtomDetails.relations_to || selectedAtomDetails.relations_to.length === 0)"
                                 class="text-sm text-muted mt-2">尚無關係</div>
                        </div>

                        <!-- 阻塞狀態 -->
                        <div class="wb-panel-section" x-show="selectedAtomDetails && selectedAtomDetails.is_blocked">
                            <div class="wb-panel-section-title">阻塞狀態</div>
                            <div>
                                <div class="block-status-badge">已阻塞</div>
                                <div class="mt-2">
                                    <template x-for="b in (selectedAtomDetails ? selectedAtomDetails.blockers : [])" :key="b.id">
                                        <div class="blocker-item"
                                             :class="{ 'off-canvas': !isAtomOnCanvas(b.id) }"
                                             @click="isAtomOnCanvas(b.id) && navigateToAtom(b.id)">
                                            <span x-text="b.title"></span>
                                            <span class="text-sm text-muted" x-text="'(' + b.lifecycle + ')'"></span>
                                        </div>
                                    </template>
                                </div>
                                <button class="btn btn-sm btn-secondary mt-2"
                                        @click="traceBlockChain(selectedAtomDetails.id)">
                                    追溯阻塞鍊
                                </button>
                            </div>

                            <!-- 阻塞鍊結果 -->
                            <template x-if="blockChain && blockChain.chain && blockChain.chain.length > 0">
                                <div class="block-chain-result mt-2">
                                    <div class="text-sm" style="font-weight:600; margin-bottom:4px;">阻塞鍊追溯</div>
                                    <template x-for="node in blockChain.chain" :key="node.atom_id + '-' + node.depth">
                                        <div class="block-chain-node"
                                             :style="'padding-left:' + (node.depth * 16) + 'px;'"
                                             :class="{ 'off-canvas': !isAtomOnCanvas(node.atom_id) }"
                                             @click="isAtomOnCanvas(node.atom_id) && navigateToAtom(node.atom_id)">
                                            <span x-text="'--'.repeat(node.depth) + ' '"></span>
                                            <span x-text="node.title"></span>
                                            <span class="text-muted text-sm" x-text="'(' + node.lifecycle + ')'"></span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <div class="wb-panel-section">
                            <div class="wb-panel-section-title">資訊</div>
                            <div class="text-sm text-muted">
                                <div>Vitality: <span x-text="selectedAtom.atom && selectedAtom.atom.vitality_score != null ? selectedAtom.atom.vitality_score.toFixed(2) : '-'"></span></div>
                                <div>來源: <span x-text="selectedAtom.atom ? selectedAtom.atom.source : ''"></span></div>
                                <div>建立: <span x-text="formatDate(selectedAtom.atom ? selectedAtom.atom.created_at : '')"></span></div>
                                <div>更新: <span x-text="formatDate(selectedAtom.atom ? selectedAtom.atom.updated_at : '')"></span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

    </div>

    <!-- ============================================ -->
    <!-- Modals -->
    <!-- ============================================ -->

    <!-- 新增原子 -->
    <template x-if="showNewAtomModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>新增原子</h3>
                    <button class="modal-close" @click="showNewAtomModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>標題</label>
                        <input class="form-control" x-model="newAtom.title" placeholder="輸入標題..."
                               @keydown.enter="createNewAtom()">
                    </div>
                    <div class="form-group">
                        <label>內容</label>
                        <textarea class="form-control" x-model="newAtom.content" rows="3" placeholder="輸入內容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>類型</label>
                        <select class="form-control" x-model="newAtom.atom_type">
                            <option value="A">A - 萬用</option>
                            <option value="B">B - 發散</option>
                            <option value="C">C - 流程</option>
                            <option value="D">D - 歸納</option>
                            <option value="E">E - 套表</option>
                            <option value="F">F - 碎片</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showNewAtomModal=false">取消</button>
                    <button class="btn btn-primary" @click="createNewAtom()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 放置現有原子 -->
    <template x-if="showAddExistingModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>放置現有原子</h3>
                    <button class="modal-close" @click="showAddExistingModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <input class="form-control" x-model="searchQuery" placeholder="搜尋原子..."
                               @input.debounce.300ms="doSearch()">
                    </div>
                    <div style="max-height:300px; overflow-y:auto;">
                        <template x-for="a in searchResults" :key="a.id">
                            <div class="flex items-center justify-between" style="padding:8px; border-bottom:1px solid var(--border-light);">
                                <div style="flex:1; min-width:0;">
                                    <div style="font-size:13px; font-weight:500;" x-text="a.title"></div>
                                    <div class="text-sm text-muted">
                                        <span x-text="a.atom_type + ' / ' + a.lifecycle"></span>
                                        <span x-show="a.similarity > 0" x-text="' / sim:' + (a.similarity ? a.similarity.toFixed(2) : '')" style="color:var(--accent);"></span>
                                        <span x-show="a.match_type === 'text'" style="color:var(--warning);">[text]</span>
                                    </div>
                                </div>
                                <button class="btn btn-sm btn-primary" style="margin-left:8px; flex-shrink:0;" @click="addExistingAtom(a.id)">放置</button>
                            </div>
                        </template>
                        <div x-show="searchResults.length === 0" class="empty-state" style="padding:20px;">
                            <p>沒有可放置的原子</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showAddExistingModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 新增白板 -->
    <template x-if="showNewCanvasModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>新增白板</h3>
                    <button class="modal-close" @click="showNewCanvasModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>白板名稱</label>
                        <input class="form-control" x-model="newCanvasName" placeholder="輸入名稱..."
                               @keydown.enter="createCanvas()">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showNewCanvasModal=false">取消</button>
                    <button class="btn btn-primary" @click="createCanvas()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 標籤管理 -->
    <template x-if="showTagModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>標籤管理</h3>
                    <button class="modal-close" @click="showTagModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="flex gap-2 mb-4">
                        <input class="form-control" x-model="newTagName" placeholder="新標籤名稱..."
                               @keydown.enter="createTag()" style="flex:1;">
                        <input type="color" x-model="newTagColor"
                               style="width:36px; height:32px; border:1px solid var(--border-light); border-radius:4px; cursor:pointer;">
                        <button class="btn btn-primary" @click="createTag()">建立</button>
                    </div>
                    <template x-for="t in tags" :key="t.id">
                        <div class="flex items-center justify-between" style="padding:6px 0; border-bottom:1px solid var(--border-light);">
                            <span class="tag-badge" :style="getTagStyle(t.color)" x-text="t.name"></span>
                            <button class="btn-ghost btn-sm" @click="if(confirm('刪除標籤?')) deleteTag(t.id)">刪除</button>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showTagModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 關係類型選擇 -->
    <template x-if="showRelationModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>建立關係</h3>
                    <button class="modal-close" @click="showRelationModal=false; pendingConnection=null; mode='select'">x</button>
                </div>
                <div class="modal-body">
                    <div class="mb-4 text-sm" x-show="pendingConnection">
                        <strong x-text="getAtomTitle(pendingConnection ? pendingConnection.sourceAtomId : 0)"></strong>
                        <span class="text-muted"> --> </span>
                        <strong x-text="getAtomTitle(pendingConnection ? pendingConnection.targetAtomId : 0)"></strong>
                    </div>
                    <div class="form-group">
                        <label>關係類型</label>
                        <template x-for="rt in relationTypeList" :key="rt.value">
                            <label class="relation-option"
                                   :class="{ selected: selectedRelationType === rt.value }">
                                <input type="radio" name="relType" :value="rt.value"
                                       x-model="selectedRelationType" style="margin-right:8px;">
                                <span class="relation-color-dot" :style="'background:' + rt.color"></span>
                                <span x-text="rt.label"></span>
                                <span class="text-muted text-sm" style="margin-left:4px;" x-text="rt.desc"></span>
                            </label>
                        </template>
                    </div>
                    <div class="form-group">
                        <label>說明（選填）</label>
                        <input class="form-control" x-model="relationLabel" placeholder="關係描述..."
                               @keydown.enter="confirmConnection()">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showRelationModal=false; pendingConnection=null; mode='select'">取消</button>
                    <button class="btn btn-primary" @click="confirmConnection()">建立</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 群組編輯 -->
    <template x-if="showGroupModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>編輯群組</h3>
                    <button class="modal-close" @click="showGroupModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>名稱</label>
                        <input class="form-control" x-model="groupForm.name"
                               @keydown.enter="saveGroupEdit()">
                    </div>
                    <div class="form-group">
                        <label>顏色</label>
                        <input type="color" x-model="groupForm.color"
                               style="width:60px; height:32px; border:1px solid var(--border-light); border-radius:4px; cursor:pointer;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showGroupModal=false">取消</button>
                    <button class="btn btn-primary" @click="saveGroupEdit()">儲存</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Card Editor 彈窗 -->
    <template x-if="cardEditorOpen">
        <div class="card-editor-overlay" @keydown.escape.stop="closeCardEditor()">
            <div class="card-editor-dialog" @click.stop>
                <!-- Header -->
                <div class="card-editor-header">
                    <input class="card-editor-title-input"
                           x-model="cardEditorTitle"
                           placeholder="輸入標題..."
                           @input="cardEditorDirty = true"
                           @keydown.enter="$refs.tiptapHost && $refs.tiptapHost.focus()">
                    <div class="card-editor-meta">
                        <span x-text="cardEditorAtomType"></span>
                        <span x-text="cardEditorAtomId ? '#' + cardEditorAtomId : ''"></span>
                    </div>
                    <button class="card-editor-close" @click="closeCardEditor()">x</button>
                </div>
                <!-- 工具列 -->
                <div class="card-editor-toolbar">
                    <button @click="ceCmd('bold')" :class="{ active: ceIsActive('bold') }" title="粗體"><b>B</b></button>
                    <button @click="ceCmd('italic')" :class="{ active: ceIsActive('italic') }" title="斜體"><i>I</i></button>
                    <button @click="ceCmd('underline')" :class="{ active: ceIsActive('underline') }" title="底線"><u>U</u></button>
                    <button @click="ceCmd('strike')" :class="{ active: ceIsActive('strike') }" title="刪除線"><s>S</s></button>
                    <button @click="ceCmd('code')" :class="{ active: ceIsActive('code') }" title="行內程式碼">&lt;&gt;</button>
                    <span class="tb-sep"></span>
                    <button @click="ceCmd('h1')" :class="{ active: ceIsActive('heading', {level:1}) }" title="標題 1">H1</button>
                    <button @click="ceCmd('h2')" :class="{ active: ceIsActive('heading', {level:2}) }" title="標題 2">H2</button>
                    <button @click="ceCmd('h3')" :class="{ active: ceIsActive('heading', {level:3}) }" title="標題 3">H3</button>
                    <span class="tb-sep"></span>
                    <button @click="ceCmd('bulletList')" :class="{ active: ceIsActive('bulletList') }" title="項目清單">-</button>
                    <button @click="ceCmd('orderedList')" :class="{ active: ceIsActive('orderedList') }" title="編號清單">1.</button>
                    <button @click="ceCmd('taskList')" :class="{ active: ceIsActive('taskList') }" title="任務清單">[]</button>
                    <span class="tb-sep"></span>
                    <button @click="ceCmd('blockquote')" :class="{ active: ceIsActive('blockquote') }" title="引用">"</button>
                    <button @click="ceCmd('codeBlock')" :class="{ active: ceIsActive('codeBlock') }" title="程式區塊">{}</button>
                    <button @click="ceCmd('hr')" title="分隔線">--</button>
                    <span class="tb-sep"></span>
                    <button @click="ceCmd('table')" title="插入表格">田</button>
                    <template x-if="ceIsActive('table')">
                        <span style="display:inline-flex; gap:2px;">
                            <button @click="ceCmd('addRowAfter')" title="新增列">+行</button>
                            <button @click="ceCmd('addColAfter')" title="新增欄">+欄</button>
                            <button @click="ceCmd('deleteRow')" title="刪除列">-行</button>
                            <button @click="ceCmd('deleteCol')" title="刪除欄">-欄</button>
                            <button @click="ceCmd('deleteTable')" title="刪除表格">x表</button>
                        </span>
                    </template>
                    <span class="tb-sep"></span>
                    <button @click="ceInsertLink()" title="插入連結">Link</button>
                    <span class="tb-sep"></span>
                    <button @click="ceCmd('undo')" title="復原">&#8630;</button>
                    <button @click="ceCmd('redo')" title="重做">&#8631;</button>
                </div>
                <!-- 編輯區 -->
                <div class="card-editor-body">
                    <div x-ref="tiptapHost"></div>
                </div>
                <!-- Footer -->
                <div class="card-editor-footer">
                    <span class="status-text" x-text="cardEditorDirty ? '已修改' : '已儲存'"></span>
                    <div class="btn-group">
                        <button class="btn btn-secondary" @click="closeCardEditor()">關閉</button>
                        <button class="btn btn-primary" @click="saveCardEditor()" :disabled="!cardEditorDirty">儲存</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 連線標籤 inline 編輯 -->
    <template x-if="editingConnId">
        <div class="conn-edit-overlay"
             @click="saveConnectionLabel()" @keydown.escape.stop="cancelEditConnection()">
            <input class="conn-edit-input"
                   :style="'left:' + editingConnPos.x + 'px; top:' + editingConnPos.y + 'px;'"
                   x-model="editingConnLabel"
                   x-init="$nextTick(() => $el.focus())"
                   @click.stop
                   @keydown.enter="saveConnectionLabel()">
        </div>
    </template>

    <!-- 匯出彈窗 -->
    <template x-if="showExportModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:700px;">
                <div class="modal-header">
                    <h3>匯出畫布</h3>
                    <button class="modal-close" @click="showExportModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div style="display:flex;gap:8px;margin-bottom:12px;">
                        <button class="btn btn-sm" :class="exportFormat==='json' ? 'btn-primary' : 'btn-secondary'"
                                @click="exportCanvas('json')">JSON</button>
                        <button class="btn btn-sm" :class="exportFormat==='md' ? 'btn-primary' : 'btn-secondary'"
                                @click="exportCanvas('md')">Markdown</button>
                    </div>
                    <textarea class="form-control" rows="15" readonly
                              x-model="exportContent" style="font-family:monospace;font-size:12px;"></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="copyExport()">複製</button>
                    <button class="btn btn-primary" @click="downloadExport()">下載</button>
                    <button class="btn btn-secondary" @click="showExportModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 匯入彈窗 -->
    <template x-if="showImportModal">
        <div class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>匯入畫布 (JSON)</h3>
                    <button class="modal-close" @click="showImportModal=false">x</button>
                </div>
                <div class="modal-body">
                    <p class="text-sm text-muted" style="margin-bottom:12px;">
                        選擇先前匯出的 JSON 檔案，將原子放置到當前畫布。已存在的原子會跳過。
                    </p>
                    <input type="file" accept=".json" @change="importCanvasFromFile($event)"
                           style="font-size:13px;">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showImportModal=false">關閉</button>
                </div>
            </div>
        </div>
    </template>

    <!-- 右鍵選單 -->
    <template x-if="contextMenu">
        <div class="context-menu" :style="'left:' + contextMenu.x + 'px; top:' + contextMenu.y + 'px;'" @click.stop>
            <template x-if="contextMenu.type === 'canvas'">
                <div>
                    <div class="context-menu-item" @click="contextAddAtom()">新增原子</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="fitView(); closeContextMenu()">適應視圖</div>
                    <div class="context-menu-item" @click="resetZoom(); closeContextMenu()">重置縮放</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="exportCanvas('json'); closeContextMenu()">匯出 JSON</div>
                    <div class="context-menu-item" @click="exportCanvas('md'); closeContextMenu()">匯出 Markdown</div>
                </div>
            </template>
            <template x-if="contextMenu.type === 'card'">
                <div>
                    <div class="context-menu-item" @click="openCardEditor(contextMenu.ca.atom_id); closeContextMenu()">開啟卡片</div>
                    <div class="context-menu-item" @click="selectCard(contextMenu.ca.atom_id); closeContextMenu()">側欄編輯</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="removeFromCanvas(contextMenu.ca); closeContextMenu()">從白板移除</div>
                    <div class="context-menu-item danger"
                         @click="if(confirm('刪除此原子? 所有白板都會移除')) { deleteAtomEntirely(contextMenu.ca); closeContextMenu(); }">刪除原子</div>
                </div>
            </template>
            <template x-if="contextMenu.type === 'group'">
                <div>
                    <div class="context-menu-item" @click="openGroupEditModal(contextMenu.group); closeContextMenu()">編輯群組</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" @click="ungroupAtoms(contextMenu.group.id); closeContextMenu()">解散群組</div>
                </div>
            </template>
        </div>
    </template>

</div>
{% endblock %}
