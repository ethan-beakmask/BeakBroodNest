<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeakCortex - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #fff;
            border-radius: 6px;
            padding: 36px 32px;
            width: 340px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .login-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
            color: #1e293b;
        }
        .form-input:focus { border-color: #3b82f6; }
        .btn-login {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: #1e293b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-login:hover { background: #334155; }
        .alert {
            padding: 8px 12px;
            font-size: 13px;
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 4px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">BeakCortex</div>
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/bc/login">
            <div class="form-group">
                <label for="username" class="form-label">Account</label>
                <input type="text" class="form-input" id="username" name="username"
                       autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-input" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
</body>
</html>
