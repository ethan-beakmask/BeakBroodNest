<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BeakBroodNest{% endblock %}</title>
    <link rel="icon" href="/beakbroodnest/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/beakbroodnest/static/css/main.css?v={{ cache_ver }}">
    {% block extra_css %}{% endblock %}
    <script src="/beakbroodnest/static/vendor/marked.min.js"></script>
    <script defer src="/beakbroodnest/static/vendor/alpine.min.js"></script>
    <script>window.__BBN_AES_KEY = "{{ aes_key }}";</script>
    <script src="/beakbroodnest/static/js/api.js?v={{ cache_ver }}"></script>
    {% block extra_js %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
</body>
</html>
