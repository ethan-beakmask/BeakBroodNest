{% extends "base.html" %}
{% block title %}資料項目 - Heptabase{% endblock %}

{% block body %}
<div x-data="itemManager({{ schema_id }})" x-init="init()">

    <!-- Header -->
    <div class="app-header">
        <div class="logo">Heptabase</div>
        <nav>
            <a href="/">白板</a>
            <a href="/schemas">表結構</a>
            <a href="#" class="active" x-text="schema ? schema.name + ' - 資料' : '資料項目'"></a>
        </nav>
    </div>

    <div class="app-layout">
        <!-- 左側 Schema 導覽 -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">表結構</div>
                <template x-for="s in allSchemas" :key="s.id">
                    <a :href="'/items/' + s.id" class="sidebar-item" :class="{ active: s.id == schemaId }">
                        <span class="icon icon-schema" x-text="s.icon || 'S'"></span>
                        <span x-text="s.name"></span>
                    </a>
                </template>
            </div>
        </div>

        <div class="content-area">
            <div class="flex items-center justify-between mb-4">
                <h1 class="page-title" style="margin-bottom:0;" x-text="schema ? schema.name : '載入中...'"></h1>
                <button class="btn btn-primary" @click="openCreate()">+ 新增項目</button>
            </div>

            <!-- 資料表格 -->
            <template x-if="items.length === 0">
                <div class="empty-state">
                    <p>此表結構尚無資料項目</p>
                    <button class="btn btn-primary" @click="openCreate()">建立第一筆</button>
                </div>
            </template>

            <template x-if="items.length > 0">
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width:40px;">#</th>
                                <th>標題</th>
                                <template x-for="f in fields" :key="f.id">
                                    <th x-text="f.label"></th>
                                </template>
                                <th style="width:120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(item, idx) in items" :key="item.id">
                                <tr>
                                    <td x-text="idx + 1"></td>
                                    <td style="font-weight:500;" x-text="item.title"></td>
                                    <template x-for="f in fields" :key="f.id">
                                        <td>
                                            <span x-text="(item.values && item.values[f.name]) || '-'"
                                                  style="white-space:pre-line;"></span>
                                        </td>
                                    </template>
                                    <td>
                                        <button class="btn btn-sm btn-secondary" @click="openEdit(item)">編輯</button>
                                        <button class="btn btn-sm btn-ghost" style="color:var(--danger);"
                                                @click="if(confirm('刪除此項目？')) deleteItem(item.id)">刪除</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </div>

    <!-- 編輯/建立 Modal -->
    <template x-if="showModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:560px;">
                <div class="modal-header">
                    <h3 x-text="editId ? '編輯項目' : '新增項目'"></h3>
                    <button class="modal-close" @click="showModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>標題（識別用）</label>
                        <input class="form-control" x-model="form.title" placeholder="輸入標題...">
                    </div>
                    <template x-for="f in fields" :key="f.id">
                        <div class="form-group">
                            <label>
                                <span x-text="f.label"></span>
                                <span x-show="f.required" style="color:var(--danger);"> *</span>
                            </label>

                            <!-- text -->
                            <template x-if="f.field_type === 'text'">
                                <input class="form-control"
                                       :value="form.values[f.name] || ''"
                                       @input="form.values[f.name] = $event.target.value">
                            </template>

                            <!-- number -->
                            <template x-if="f.field_type === 'number'">
                                <input class="form-control" type="number"
                                       :value="form.values[f.name] || ''"
                                       @input="form.values[f.name] = $event.target.value">
                            </template>

                            <!-- datetime -->
                            <template x-if="f.field_type === 'datetime'">
                                <input class="form-control" type="datetime-local"
                                       :value="form.values[f.name] || ''"
                                       @input="form.values[f.name] = $event.target.value">
                            </template>

                            <!-- select -->
                            <template x-if="f.field_type === 'select'">
                                <select class="form-control"
                                        :value="form.values[f.name] || ''"
                                        @change="form.values[f.name] = $event.target.value">
                                    <option value="">-- 請選擇 --</option>
                                    <template x-for="opt in parseOptions(f.options)" :key="opt">
                                        <option :value="opt" x-text="opt" :selected="form.values[f.name] === opt"></option>
                                    </template>
                                </select>
                            </template>

                            <!-- textarea -->
                            <template x-if="f.field_type === 'textarea'">
                                <textarea class="form-control" rows="3"
                                          :value="form.values[f.name] || ''"
                                          @input="form.values[f.name] = $event.target.value"></textarea>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showModal=false">取消</button>
                    <button class="btn btn-primary" @click="saveItem()">儲存</button>
                </div>
            </div>
        </div>
    </template>

</div>

<script>
function itemManager(schemaId) {
    return {
        schemaId: schemaId,
        schema: null,
        allSchemas: [],
        fields: [],
        items: [],
        showModal: false,
        editId: null,
        form: { title: '', values: {} },

        async init() {
            const [schema, allSchemas, data] = await Promise.all([
                API.getSchema(this.schemaId),
                API.getSchemas(),
                API.getItems(this.schemaId),
            ]);
            this.schema = schema;
            this.allSchemas = allSchemas;
            this.fields = data.fields || [];
            this.items = data.items || [];
        },

        async reload() {
            const data = await API.getItems(this.schemaId);
            this.fields = data.fields || [];
            this.items = data.items || [];
        },

        parseOptions(optStr) {
            if (!optStr) return [];
            try { return JSON.parse(optStr); }
            catch { return []; }
        },

        openCreate() {
            this.editId = null;
            this.form = { title: '', values: {} };
            this.showModal = true;
        },

        openEdit(item) {
            this.editId = item.id;
            this.form = {
                title: item.title,
                values: { ...(item.values || {}) },
            };
            this.showModal = true;
        },

        async saveItem() {
            // 自動設定 title
            let title = this.form.title;
            if (!title) {
                const firstField = this.fields[0];
                if (firstField) {
                    title = this.form.values[firstField.name] || '未命名';
                } else {
                    title = '未命名';
                }
            }

            if (this.editId) {
                await API.updateItem(this.editId, {
                    title: title,
                    values: this.form.values,
                });
            } else {
                await API.createItem({
                    schema_id: this.schemaId,
                    title: title,
                    values: this.form.values,
                });
            }
            this.showModal = false;
            await this.reload();
        },

        async deleteItem(id) {
            await API.deleteItem(id);
            await this.reload();
        },
    };
}
</script>
{% endblock %}
