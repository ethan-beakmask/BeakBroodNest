{% extends "base.html" %}
{% block title %}表結構管理 - Heptabase{% endblock %}

{% block body %}
<div x-data="schemaManager()" x-init="init()">

    <!-- Header -->
    <div class="app-header">
        <div class="logo">Heptabase</div>
        <nav>
            <a href="/">白板</a>
            <a href="/schemas" class="active">表結構</a>
        </nav>
    </div>

    <div class="app-layout">
        <div class="content-area">
            <div class="flex items-center justify-between mb-4">
                <h1 class="page-title" style="margin-bottom:0;">表結構管理</h1>
                <button class="btn btn-primary" @click="openCreate()">+ 新增表結構</button>
            </div>

            <!-- Schema 列表 -->
            <template x-if="schemas.length === 0">
                <div class="empty-state">
                    <p>尚未建立任何表結構</p>
                    <button class="btn btn-primary" @click="openCreate()">建立第一個</button>
                </div>
            </template>

            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px;">
                <template x-for="s in schemas" :key="s.id">
                    <div style="background:var(--bg-secondary); border:1px solid var(--border-light); border-radius:var(--radius-lg); padding:16px;">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <span style="font-size:15px; font-weight:600;" x-text="s.name"></span>
                                <span class="text-sm text-muted" x-text="' (' + (s.slug || '') + ')'"></span>
                            </div>
                            <div class="flex gap-2">
                                <button class="btn btn-sm btn-secondary" @click="openEdit(s)">編輯</button>
                                <a :href="'/items/' + s.id" class="btn btn-sm btn-secondary">資料</a>
                                <button class="btn btn-sm btn-ghost" style="color:var(--danger);"
                                        @click="if(confirm('刪除此表結構及所有相關資料？')) deleteSchema(s.id)">刪除</button>
                            </div>
                        </div>
                        <div class="text-sm text-muted mb-2" x-text="s.description || '無描述'"></div>
                        <!-- 載入欄位 -->
                        <div x-show="s._fields" style="margin-top:8px;">
                            <template x-for="f in (s._fields || [])" :key="f.id">
                                <div class="flex items-center gap-2 text-sm" style="padding:3px 0;">
                                    <span style="font-weight:500; min-width:80px;" x-text="f.label"></span>
                                    <span class="text-muted" x-text="f.field_type"></span>
                                    <span class="text-muted" x-text="f.required ? '(必填)' : ''"></span>
                                </div>
                            </template>
                        </div>
                        <button class="btn-ghost text-sm mt-2" @click="toggleFields(s)"
                                x-text="s._fields ? '收合欄位' : '展開欄位'"></button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 編輯/建立 Modal -->
    <template x-if="showModal">
        <div class="modal-overlay">
            <div class="modal" style="max-width:600px;">
                <div class="modal-header">
                    <h3 x-text="editId ? '編輯表結構' : '新增表結構'"></h3>
                    <button class="modal-close" @click="showModal=false">x</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>名稱</label>
                        <input class="form-control" x-model="form.name" placeholder="例如：行事曆">
                    </div>
                    <div class="form-group">
                        <label>代碼 (slug)</label>
                        <input class="form-control" x-model="form.slug" placeholder="例如：calendar">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <input class="form-control" x-model="form.description" placeholder="選填...">
                    </div>
                    <div class="form-group">
                        <label>圖示代碼</label>
                        <input class="form-control" x-model="form.icon" placeholder="例如：CAL" maxlength="4" style="width:100px;">
                    </div>

                    <!-- 欄位定義 -->
                    <div class="mt-4">
                        <div class="flex items-center justify-between mb-2">
                            <label style="font-weight:600;">欄位定義</label>
                            <button class="btn btn-sm btn-secondary" @click="addField()">+ 新增欄位</button>
                        </div>
                        <template x-for="(field, idx) in form.fields" :key="idx">
                            <div style="display:grid; grid-template-columns:1fr 1fr 100px auto auto; gap:6px; margin-bottom:6px; align-items:center;">
                                <input class="form-control" x-model="field.label" placeholder="顯示名稱">
                                <input class="form-control" x-model="field.name" placeholder="欄位代碼">
                                <select class="form-control" x-model="field.field_type">
                                    <option value="text">文字</option>
                                    <option value="number">數字</option>
                                    <option value="datetime">日期時間</option>
                                    <option value="select">下拉選單</option>
                                    <option value="textarea">多行文字</option>
                                </select>
                                <label style="font-size:12px; display:flex; align-items:center; gap:3px;">
                                    <input type="checkbox" x-model="field.required"> 必填
                                </label>
                                <button class="btn-ghost" @click="form.fields.splice(idx, 1)" style="color:var(--danger);">x</button>
                            </div>
                        </template>
                        <!-- select options 編輯 -->
                        <template x-for="(field, idx) in form.fields.filter(f => f.field_type === 'select')" :key="'opt-'+idx">
                            <div style="margin-bottom:8px; padding:8px; background:var(--bg-tertiary); border-radius:var(--radius);">
                                <label class="text-sm" x-text="field.label + ' - 選項（以逗號分隔）'"></label>
                                <input class="form-control" x-model="field.optionsStr"
                                       placeholder='例如：公司,家庭,私人'>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" @click="showModal=false">取消</button>
                    <button class="btn btn-primary" @click="saveSchema()">儲存</button>
                </div>
            </div>
        </div>
    </template>

</div>

<script>
function schemaManager() {
    return {
        schemas: [],
        showModal: false,
        editId: null,
        form: { name: '', slug: '', description: '', icon: '', fields: [] },

        async init() {
            await this.loadSchemas();
        },

        async loadSchemas() {
            this.schemas = await API.getSchemas();
        },

        async toggleFields(schema) {
            if (schema._fields) {
                schema._fields = null;
                return;
            }
            const full = await API.getSchema(schema.id);
            schema._fields = full.fields;
        },

        openCreate() {
            this.editId = null;
            this.form = { name: '', slug: '', description: '', icon: '', fields: [] };
            this.showModal = true;
        },

        async openEdit(schema) {
            this.editId = schema.id;
            const full = await API.getSchema(schema.id);
            this.form = {
                name: full.name,
                slug: full.slug,
                description: full.description || '',
                icon: full.icon || '',
                fields: full.fields.map(f => ({
                    name: f.name,
                    label: f.label,
                    field_type: f.field_type,
                    required: !!f.required,
                    options: f.options || '',
                    optionsStr: f.options ? JSON.parse(f.options).join(',') : '',
                })),
            };
            this.showModal = true;
        },

        addField() {
            this.form.fields.push({
                name: '', label: '', field_type: 'text', required: false, options: '', optionsStr: '',
            });
        },

        async saveSchema() {
            // 轉換 select options
            const fields = this.form.fields.map(f => ({
                name: f.name,
                label: f.label,
                field_type: f.field_type,
                required: f.required ? 1 : 0,
                options: f.field_type === 'select' && f.optionsStr
                    ? JSON.stringify(f.optionsStr.split(',').map(s => s.trim()).filter(Boolean))
                    : '',
            }));

            const data = {
                name: this.form.name,
                slug: this.form.slug,
                description: this.form.description,
                icon: this.form.icon,
                fields: fields,
            };

            if (this.editId) {
                await API.updateSchema(this.editId, data);
            } else {
                await API.createSchema(data);
            }
            this.showModal = false;
            await this.loadSchemas();
        },

        async deleteSchema(id) {
            await API.deleteSchema(id);
            await this.loadSchemas();
        },
    };
}
</script>
{% endblock %}
