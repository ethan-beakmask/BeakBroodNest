<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 2; }
    .core { fill: #f3f4f6; stroke: #333; stroke-width: 2; }
    .db { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .ext { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 5 4; }
    .title { font-size: 18px; font-weight: 600; fill: #111; }
    .label { font-size: 14px; fill: #222; }
    .small { font-size: 12px; fill: #555; }
    .arrow { stroke: #555; stroke-width: 1.6; fill: none; }
    .arrow-dash { stroke: #1d4ed8; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">BeakBroodNest 架構</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#666">人類介面 + AI 介面 + 共用核心</text>

  <rect class="box" x="60" y="90" width="320" height="130" rx="10"/>
  <text class="title" x="220" y="120" text-anchor="middle">人類介面 (Flask + Tiptap)</text>
  <text class="label" x="220" y="148" text-anchor="middle">白板 / 卡片編輯器</text>
  <text class="label" x="220" y="170" text-anchor="middle">語意搜尋 / 待辦 / Backlog</text>
  <text class="small" x="220" y="195" text-anchor="middle">human_ui/app.py</text>

  <rect class="box" x="500" y="90" width="320" height="130" rx="10"/>
  <text class="title" x="660" y="120" text-anchor="middle">AI 介面 (MCP Server)</text>
  <text class="label" x="660" y="148" text-anchor="middle">30+ MCP tools</text>
  <text class="label" x="660" y="170" text-anchor="middle">note_* / canvas_* / task_* / ...</text>
  <text class="small" x="660" y="195" text-anchor="middle">ai_kb/mcp_server.py</text>

  <rect class="ext" x="500" y="245" width="320" height="38" rx="8"/>
  <text class="label" x="660" y="269" text-anchor="middle">Claude Code / 其他 MCP-相容 AI</text>

  <rect class="core" x="120" y="310" width="640" height="110" rx="10"/>
  <text class="title" x="440" y="340" text-anchor="middle">共用核心 (core/)</text>
  <text class="label" x="440" y="365" text-anchor="middle">SQLAlchemy ORM &#183; 10 張核心表</text>
  <text class="label" x="440" y="388" text-anchor="middle">知識原子 (atom) &#183; 因果鍊 &#183; 阻塞追溯 &#183; 生命週期</text>
  <text class="small" x="440" y="408" text-anchor="middle">core/db.py &#183; core/models.py &#183; core/relations.py</text>

  <rect class="db" x="280" y="450" width="320" height="60" rx="10"/>
  <text class="title" x="440" y="478" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="small" x="440" y="498" text-anchor="middle">關聯資料 + 向量檢索 (semantic / hybrid)</text>

  <line class="arrow" x1="220" y1="220" x2="320" y2="310" marker-end="url(#arr)"/>
  <line class="arrow" x1="660" y1="220" x2="560" y2="310" marker-end="url(#arr)"/>
  <line class="arrow-dash" x1="660" y1="245" x2="660" y2="225"/>
  <line class="arrow" x1="440" y1="420" x2="440" y2="450" marker-end="url(#arr)"/>
</svg>
